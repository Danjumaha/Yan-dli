<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yan-Dli | Change Password</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #F3E8FF;
      --bg-gray: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ECEFF1;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-gray);
      min-height: 100vh;
      position: relative;
      padding-bottom: 90px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 0.9rem 1rem;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-color);
      gap: 0.75rem;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      padding: 4px;
      text-decoration: none;
    }

    .top-bar-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .content-body {
      padding: 1.25rem 1rem;
    }

    .page-header-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }

    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 0.8rem 2.8rem 0.8rem 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.15s ease;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* SUCCESS MODAL STYLES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 2rem 1.25rem;
      text-align: center;
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-icon-wrap {
      width: 60px;
      height: 60px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }

    .success-icon-wrap svg {
      width: 30px;
      height: 30px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2.5;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .modal-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .modal-action-btn {
      width: 100%;
      background: var(--card-bg);
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .modal-action-btn:hover {
      background: var(--primary-light);
    }

    .toast {
      position: fixed;
      bottom: 4.8rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text-dark);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      z-index: 200;
      box-shadow: var(--shadow-md);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* BOTTOM NAVIGATION BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      z-index: 30;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 500;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 700;
    }

    .nav-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- TOP HEADER -->
    <header class="top-bar">
      <a href="account.html" class="icon-btn" aria-label="Go Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <h1 class="top-bar-title">Change Password</h1>
    </header>

    <!-- CONTENT BODY -->
    <main class="content-body">
      <p class="page-header-text">Put in your current password and also the new password below.</p>

      <form id="change-password-form">
        <div class="form-group">
          <label class="form-label">Current password*</label>
          <div class="password-input-wrapper">
            <input type="password" id="current-password" class="form-input" required placeholder="Provide your current password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('current-password', this)" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">New password*</label>
          <div class="password-input-wrapper">
            <input type="password" id="new-password" class="form-input" required placeholder="Provide your new password" minlength="6">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new-password', this)" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-password-btn">CHANGE PASSWORD</button>
      </form>
    </main>

    <!-- PASSWORD CHANGED SUCCESS MODAL -->
    <div id="success-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="success-icon-wrap">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 class="modal-title">Password Changed</h2>
        <p class="modal-subtitle">You will use the new credentials to log in again.</p>
        <button class="modal-action-btn" onclick="handleSuccessOk()">OK</button>
      </div>
    </div>

    <div id="toast" class="toast">Password updated successfully!</div>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span>Home</span>
      </a>
      <a href="exams.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span>Exams</span>
      </a>
      <a href="classroom.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span>Classroom</span>
      </a>
      <a href="activate.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span>Activation</span>
      </a>
      <a href="account.html" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Account</span>
      </a>
    </nav>
  </div>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
      authDomain: "yan-dli.firebaseapp.com",
      projectId: "yan-dli",
      storageBucket: "yan-dli.firebasestorage.app",
      messagingSenderId: "538794949165",
      appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let activeUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        activeUser = user;
      } else {
        window.location.href = "index.html";
      }
    });

    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeUser) return;

      const currentPass = document.getElementById('current-password').value;
      const newPass = document.getElementById('new-password').value;
      const submitBtn = document.getElementById('submit-password-btn');

      if (newPass.length < 6) {
        showToast("New password must be at least 6 characters.");
        return;
      }

      submitBtn.innerText = "UPDATING...";
      submitBtn.disabled = true;

      try {
        // Re-authenticate user with current password for security verification
        const credential = EmailAuthProvider.credential(activeUser.email, currentPass);
        await reauthenticateWithCredential(activeUser, credential);

        // Update to new password
        await updatePassword(activeUser, newPass);

        // Show success modal matching design
        document.getElementById('success-modal').classList.add('active');
      } catch (error) {
        console.error("Password update error:", error);
        if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          showToast("Incorrect current password.");
        } else {
          showToast("Failed to update password. Try again.");
        }
        submitBtn.innerText = "CHANGE PASSWORD";
        submitBtn.disabled = false;
      }
    });
  </script>

  <script>
    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      // Toggle eye / eye-off SVG icon
      if (isPassword) {
        btnEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      } else {
        btnEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      }
    }

    async function handleSuccessOk() {
      const { getAuth, signOut } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
      try {
        await signOut(getAuth());
      } catch(e) {}
      window.location.href = "index.html";
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
  </script>
</body>
</html>
