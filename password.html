<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yan-Dli | Change Password</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #F3E8FF;
      --bg-gray: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ECEFF1;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-gray);
      min-height: 100vh;
      position: relative;
      padding-bottom: 30px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-color);
      gap: 1rem;
    }

    /* Modern OPay-style Back Button */
    .back-btn {
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background: #F8FAFC; 
      color: var(--text-dark);
      border: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .top-bar-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .content-body {
      padding: 1.25rem 1rem;
    }

    .page-header-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
    }

    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 0.8rem 2.8rem 0.8rem 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .password-toggle-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .password-toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.9rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.15s ease;
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.2);
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .submit-btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* SUCCESS MODAL STYLES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      display: none;
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 2rem 1.25rem;
      text-align: center;
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-icon-wrap {
      width: 60px;
      height: 60px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }

    .success-icon-wrap svg {
      width: 30px;
      height: 30px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2.5;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .modal-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .modal-action-btn {
      width: 100%;
      background: var(--card-bg);
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .modal-action-btn:hover {
      background: var(--primary-light);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text-dark);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      z-index: 200;
      box-shadow: var(--shadow-md);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- TOP HEADER WITH OPAY-STYLE BACK ARROW -->
    <header class="top-bar">
      <a href="account.html" class="back-btn" title="Back to Account">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <h1 class="top-bar-title">Change Password</h1>
    </header>

    <!-- CONTENT BODY -->
    <main class="content-body">
      <p class="page-header-text">Put in your current password and also the new password below.</p>

      <form id="change-password-form">
        <div class="form-group">
          <label class="form-label">Current password*</label>
          <div class="password-input-wrapper">
            <input type="password" id="current-password" class="form-input" required placeholder="Provide your current password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('current-password', this)" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">New password*</label>
          <div class="password-input-wrapper">
            <input type="password" id="new-password" class="form-input" required placeholder="Provide your new password" minlength="6">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new-password', this)" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-password-btn">CHANGE PASSWORD</button>
      </form>
    </main>

    <!-- PASSWORD CHANGED SUCCESS MODAL -->
    <div id="success-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="success-icon-wrap">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h2 class="modal-title">Password Changed</h2>
        <p class="modal-subtitle">You will use the new credentials to log in again.</p>
        <button class="modal-action-btn" onclick="handleSuccessOk()">OK</button>
      </div>
    </div>

    <div id="toast" class="toast">Password updated successfully!</div>
  </div>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential, updatePassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
      authDomain: "yan-dli.firebaseapp.com",
      databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
      projectId: "yan-dli",
      storageBucket: "yan-dli.firebasestorage.app",
      messagingSenderId: "538794949165",
      appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let activeUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        activeUser = user;
      } else {
        window.location.href = "index.html";
      }
    });

    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeUser) return;

      const currentPass = document.getElementById('current-password').value;
      const newPass = document.getElementById('new-password').value;
      const submitBtn = document.getElementById('submit-password-btn');

      if (newPass.length < 6) {
        showToast("New password must be at least 6 characters.");
        return;
      }

      submitBtn.innerText = "UPDATING...";
      submitBtn.disabled = true;

      try {
        const credential = EmailAuthProvider.credential(activeUser.email, currentPass);
        await reauthenticateWithCredential(activeUser, credential);
        await updatePassword(activeUser, newPass);
        document.getElementById('success-modal').classList.add('active');
      } catch (error) {
        console.error("Password update error:", error);
        if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          showToast("Incorrect current password.");
        } else {
          showToast("Failed to update password. Try again.");
        }
        submitBtn.innerText = "CHANGE PASSWORD";
        submitBtn.disabled = false;
      }
    });
  </script>

  <script>
    function togglePasswordVisibility(inputId, btnEl) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      
      if (isPassword) {
        btnEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      } else {
        btnEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      }
    }

    async function handleSuccessOk() {
      const { getAuth, signOut } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");
      try {
        await signOut(getAuth());
      } catch(e) {}
      window.location.href = "index.html";
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
  </script>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Yan-Dli Offline Engine Active:', reg.scope);
          // Auto update service worker if new version is deployed
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('New update available! Reloading...');
              }
            };
          };
        })
        .catch((err) => console.error('ServiceWorker registration failed:', err));
    });
  }
</script>




<!-- YAN-DLI OFFLINE DATABASE ENGINE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
    authDomain: "yan-dli.firebaseapp.com",
    databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
    projectId: "yan-dli",
    storageBucket: "yan-dli.firebasestorage.app",
    messagingSenderId: "538794949165",
    appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Automatically enable offline caching for Firestore data
    enableIndexedDbPersistence(db).catch((err) => {
      if (err.code === 'failed-precondition') {
        console.log("Persistence active in another open tab.");
      } else if (err.code === 'unimplemented') {
        console.log("Browser does not support offline persistence.");
      }
    });
  } catch (e) {
    // Prevents duplicate initialization errors if Firebase is already initialized above
    console.log("Offline DB engine active.");
  }
</script>

</body>
</html>
