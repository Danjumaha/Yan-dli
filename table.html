<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yan-Dli | Timetable Planner</title>
  
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">


  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #F3E8FF;
      --bg-gray: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(124, 58, 237, 0.1);
      --grid-line: #CBD5E1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ECEFF1;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-gray);
      min-height: 100vh;
      position: relative;
      padding-bottom: 40px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background: #F8FAFC; 
      color: var(--text-dark);
      border: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .content-body {
      padding: 1rem;
    }

    .page-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 0.25rem;
    }

    .page-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* NOTIFICATION BANNER */
    .app-notification {
      background: var(--primary-light);
      color: var(--primary-hover);
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 0.85rem;
      display: none;
      border: 1px solid rgba(124, 58, 237, 0.2);
      font-weight: 500;
    }
    .app-notification.active { display: block; }

    /* COUNTDOWN SECTION */
    .countdown-section {
      margin-bottom: 1.25rem;
    }
    .countdown-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .action-text-btn {
      font-size: 0.78rem;
      color: var(--primary);
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .countdown-card {
      background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      position: relative;
      box-shadow: var(--shadow-md);
      margin-bottom: 0.75rem;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    .countdown-card.urgent {
      background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
    }

    .countdown-card.expired {
      background: linear-gradient(135deg, #4B5563 0%, #1F2937 100%);
    }

    .countdown-status-msg {
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 0.65rem;
      display: inline-block;
      letter-spacing: 0.2px;
    }

    .countdown-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.65rem;
    }

    .countdown-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .countdown-actions-group {
      display: flex;
      gap: 6px;
    }

    .event-chip-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #FFF;
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    .event-chip-btn:hover { background: rgba(255, 255, 255, 0.35); }

    .countdown-timers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      text-align: center;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 2px;
      border-radius: var(--radius-sm);
      backdrop-filter: blur(4px);
    }

    .time-val {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .time-lbl {
      font-size: 0.58rem;
      opacity: 0.85;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* MULTI-TABLE TABS */
    .table-tabs-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .table-tabs-container::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 3px 8px rgba(124, 58, 237, 0.25);
    }

    .add-table-btn {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px dashed var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* GOOGLE SHEETS TOOLBAR */
    .sheet-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sheet-toolbar::-webkit-scrollbar { display: none; }

    .sheet-tool-btn {
      background: var(--bg-gray);
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .sheet-tool-btn:hover {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
    }

    .sheet-tool-btn.danger {
      color: #EF4444;
    }
    .sheet-tool-btn.danger:hover {
      background: #FEE2E2;
      border-color: #EF4444;
    }

    /* SHEET GRID & TABLE WITH HORIZONTAL SCROLLING */
    .sheet-table-wrapper {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--card-bg);
      border: 1px solid var(--grid-line);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .sheets-grid {
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.78rem;
    }

    .sheets-grid th, .sheets-grid td {
      border: 1px solid var(--grid-line);
      padding: 0;
      position: relative;
      height: 38px;
      min-width: 120px;
      width: 120px;
    }

    .sheets-grid th.row-index-col, .sheets-grid td.row-index-col {
      min-width: 40px !important;
      width: 40px !important;
      background: #F1F5F9 !important;
      color: var(--text-muted);
      text-align: center;
      font-weight: 600;
      font-size: 0.7rem;
      user-select: none;
      position: sticky;
      left: 0;
      z-index: 10;
    }

    .sheets-grid th {
      background: #F1F5F9;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-align: center;
      user-select: none;
    }

    .col-header-input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      text-align: center;
      font-weight: 700;
      color: var(--primary-hover);
      font-size: 0.78rem;
      padding: 4px;
      outline: none;
    }
    .col-header-input:focus {
      background: #FFFFFF;
      box-shadow: inset 0 0 0 2px var(--primary);
    }

    .cell-input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      padding: 6px 8px;
      font-size: 0.8rem;
      color: var(--text-dark);
      background: transparent;
      transition: background 0.15s;
    }

    .cell-input:focus {
      background: #FFFFFF !important;
      box-shadow: inset 0 0 0 2px var(--primary);
      z-index: 5;
      position: relative;
    }

    /* CELL BRAND COLOR PRESETS */
    .cell-input.tag-purple { background: #F3E8FF; color: #6D28D9; font-weight: 600; }
    .cell-input.tag-amber { background: #FEF3C7; color: #B45309; font-weight: 700; }
    .cell-input.tag-indigo { background: #E0E7FF; color: #3730A3; font-weight: 600; }
    .cell-input.tag-emerald { background: #ECFDF5; color: #047857; font-weight: 600; }

    /* CLEAN MODERN POPUP MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.18);
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      color: var(--text-dark);
    }

    .modal-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    /* NEAT COLOR PRESET GRID */
    .color-preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 1rem;
    }

    .preset-card-option {
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .preset-card-option:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .color-indicator-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 0.75rem;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      background: var(--bg-gray);
      color: var(--text-dark);
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); background: #FFF; }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .btn-secondary {
      flex: 1;
      background: var(--bg-gray);
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 0.65rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .btn-primary {
      flex: 1;
      background: var(--primary);
      border: none;
      color: #FFF;
      padding: 0.65rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
    }

    .btn-danger {
      flex: 1;
      background: #EF4444;
      border: none;
      color: #FFF;
      padding: 0.65rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TOP HEADER -->
    <header class="top-bar">
      <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
    </header>

    <!-- CONTENT BODY -->
    <main class="content-body">
      <h1 class="page-title">University Timetable & Countdowns</h1>
      <p class="page-subtitle">Clean interactive table and event planner</p>

      <div id="app-notification" class="app-notification"></div>

      <!-- COUNTDOWN SECTION -->
      <section class="countdown-section">
        <div class="countdown-header-flex">
          <span class="section-title">Active Countdowns</span>
          <button class="action-text-btn" onclick="openAddEventModal(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Event
          </button>
        </div>
        <div id="countdown-cards-container">
          <!-- Dynamic Countdowns -->
        </div>
      </section>

      <!-- MULTI-TABLE TABS -->
      <div class="countdown-header-flex" style="margin-top: 1.25rem; margin-bottom: 0.4rem;">
        <span class="section-title">My Tables</span>
        <span style="font-size: 0.68rem; color: var(--text-muted);">Tap cell to edit</span>
      </div>

      <div class="table-tabs-container" id="tabs-bar">
        <!-- Dynamic Table Tabs -->
      </div>

      <!-- SHEET TOOLBAR -->
      <div class="sheet-toolbar">
        <button class="sheet-tool-btn" onclick="openRenameTableModal()">
          ✏️ Rename
        </button>
        <button class="sheet-tool-btn" onclick="addNewRow()">
          ➕ Add Row
        </button>
        <button class="sheet-tool-btn danger" onclick="removeLastRow()">
          ➖ Remove Row
        </button>
        <button class="sheet-tool-btn" onclick="addNewCol()">
          ➕ Add Col
        </button>
        <button class="sheet-tool-btn danger" onclick="removeLastCol()">
          ➖ Remove Col
        </button>
        <button class="sheet-tool-btn" onclick="openPresetModal()">
          🎨 Cell Color
        </button>
        <button class="sheet-tool-btn danger" onclick="clearActiveCell()">
          🗑️ Clear
        </button>
        <button class="sheet-tool-btn danger" onclick="confirmDeleteCurrentTable()">
          🗑️ Delete Table
        </button>
      </div>

      <!-- SHEET INTERACTIVE TABLE -->
      <div class="sheet-table-wrapper">
        <table class="sheets-grid" id="sheets-timetable">
          <thead id="sheets-head">
            <!-- Populated dynamically -->
          </thead>
          <tbody id="sheets-body">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- CUSTOM DESIGNED CONFIRMATION DIALOG MODAL -->
    <div id="confirm-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-title" id="confirm-modal-title">Delete Confirmation</div>
        <div class="modal-desc" id="confirm-modal-desc">Are you sure you want to proceed?</div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeConfirmModal()">Cancel</button>
          <button type="button" class="btn-danger" id="confirm-modal-btn">Delete</button>
        </div>
      </div>
    </div>

    <!-- RENAME TABLE MODAL -->
    <div id="rename-table-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-title">Rename Table</div>
        <form onsubmit="saveRenamedTable(event)">
          <div class="form-group">
            <label for="rename-table-input">Table Name</label>
            <input type="text" id="rename-table-input" placeholder="e.g. 100L Timetable" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="closeRenameTableModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Title</button>
          </div>
        </form>
      </div>
    </div>

    <!-- CLEAN NEAT CELL COLOR PRESET MODAL -->
    <div id="preset-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-title">Highlight Selected Cell</div>
        <div class="color-preset-grid">
          <div class="preset-card-option" style="background: #F3E8FF; color: #6D28D9;" onclick="applyDirectPreset('tag-purple')">
            <div class="color-indicator-circle" style="background: #7C3AED;"></div>
            <span>Purple</span>
          </div>
          <div class="preset-card-option" style="background: #FEF3C7; color: #B45309;" onclick="applyDirectPreset('tag-amber')">
            <div class="color-indicator-circle" style="background: #D97706;"></div>
            <span>Amber</span>
          </div>
          <div class="preset-card-option" style="background: #E0E7FF; color: #3730A3;" onclick="applyDirectPreset('tag-indigo')">
            <div class="color-indicator-circle" style="background: #4338CA;"></div>
            <span>Indigo</span>
          </div>
          <div class="preset-card-option" style="background: #ECFDF5; color: #047857;" onclick="applyDirectPreset('tag-emerald')">
            <div class="color-indicator-circle" style="background: #059669;"></div>
            <span>Emerald</span>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="applyDirectPreset('')">Clear Highlight</button>
          <button type="button" class="btn-secondary" onclick="closePresetModal()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- NEW SHEET / TABLE MODAL -->
    <div id="new-table-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-title">Create New Table</div>
        <form onsubmit="createNewTable(event)">
          <div class="form-group">
            <label for="table-name-input">Table Name</label>
            <input type="text" id="table-name-input" placeholder="e.g. Exam Timetable, Study Routine" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="closeNewTableModal()">Cancel</button>
            <button type="submit" class="btn-primary">Create Table</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ADD / EDIT COUNTDOWN EVENT MODAL -->
    <div id="event-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-title" id="event-modal-title">Add Countdown Event</div>
        <form id="event-form" onsubmit="saveCountdownEvent(event)">
          <input type="hidden" id="event-edit-index" value="-1">
          <div class="form-group">
            <label for="event-name-input">Event Name</label>
            <input type="text" id="event-name-input" placeholder="e.g. Mid-Semester Exams" required>
          </div>
          <div class="form-group">
            <label for="event-date-input">Target Date & Time</label>
            <input type="datetime-local" id="event-date-input" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" onclick="closeEventModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save Event</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- FIREBASE ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
      authDomain: "yan-dli.firebaseapp.com",
      databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
      projectId: "yan-dli",
      storageBucket: "yan-dli.firebasestorage.app",
      messagingSenderId: "538794949165",
      appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserUid = null;
    let activeCellRef = null;
    let pendingConfirmAction = null;

    // Default Preset Columns matching user requirements (Time, Day, Course, Venue)
    const defaultTables = [
      {
        id: "tab_1",
        name: "Timetable 1",
        headers: ["Time", "Day", "Course", "Venue"],
        rows: [
          ["", "", "", ""],
          ["", "", "", ""],
          ["", "", "", ""],
          ["", "", "", ""],
          ["", "", "", ""]
        ],
        tags: {}
      }
    ];

    let userTables = JSON.parse(localStorage.getItem('yandli_userTables')) || defaultTables;
    let activeTableIndex = 0;
    let countdownEvents = JSON.parse(localStorage.getItem('yandli_countdowns')) || [];

    function showNotification(msg) {
      const note = document.getElementById('app-notification');
      note.innerText = msg;
      note.classList.add('active');
      setTimeout(() => note.classList.remove('active'), 2500);
    }

    // CUSTOM STYLISH CONFIRMATION DIALOG MODAL
    window.openConfirmModal = function(title, description, onConfirmCallback) {
      document.getElementById('confirm-modal-title').innerText = title;
      document.getElementById('confirm-modal-desc').innerText = description;
      pendingConfirmAction = onConfirmCallback;
      document.getElementById('confirm-modal').classList.add('active');
    };

    window.closeConfirmModal = function() {
      document.getElementById('confirm-modal').classList.remove('active');
      pendingConfirmAction = null;
    };

    document.getElementById('confirm-modal-btn').onclick = function() {
      if (pendingConfirmAction) pendingConfirmAction();
      closeConfirmModal();
    };

    function renderTabs() {
      const container = document.getElementById('tabs-bar');
      container.innerHTML = '';

      userTables.forEach((tbl, idx) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${idx === activeTableIndex ? 'active' : ''}`;
        btn.innerHTML = `<span>${tbl.name}</span>`;
        btn.onclick = () => {
          activeTableIndex = idx;
          renderTabs();
          renderSheetsGrid();
        };
        container.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-table-btn';
      addBtn.innerText = '+ New Table';
      addBtn.onclick = () => document.getElementById('new-table-modal').classList.add('active');
      container.appendChild(addBtn);
    }

    function renderSheetsGrid() {
      const thead = document.getElementById('sheets-head');
      const tbody = document.getElementById('sheets-body');

      if (!userTables[activeTableIndex]) activeTableIndex = 0;
      const currentTable = userTables[activeTableIndex] || defaultTables[0];

      // Calculate explicit width for the table based on column count
      const totalWidth = 40 + (currentTable.headers.length * 120);
      document.getElementById('sheets-timetable').style.width = `${totalWidth}px`;

      // Build Headers
      let headHTML = `<tr><th class="row-index-col">#</th>`;
      currentTable.headers.forEach((colName, cIdx) => {
        headHTML += `
          <th>
            <input type="text" class="col-header-input" value="${colName}" onchange="updateColHeader(${cIdx}, this.value)" />
          </th>
        `;
      });
      headHTML += `</tr>`;
      thead.innerHTML = headHTML;

      // Build Body Rows
      tbody.innerHTML = '';
      currentTable.rows.forEach((row, rIdx) => {
        const tr = document.createElement('tr');
        
        let rowHTML = `<td class="row-index-col">${rIdx + 1}</td>`;
        row.forEach((cellVal, cIdx) => {
          const key = `cell_${rIdx}_${cIdx}`;
          const tagClass = currentTable.tags[key] || '';
          rowHTML += `
            <td>
              <input type="text" 
                id="${key}"
                class="cell-input ${tagClass}" 
                value="${cellVal || ''}" 
                onfocus="setActiveCell(this)"
                onchange="updateCellValue(${rIdx}, ${cIdx}, this.value)" 
              />
            </td>
          `;
        });

        tr.innerHTML = rowHTML;
        tbody.appendChild(tr);
      });
    }

    window.setActiveCell = function(inputEl) {
      activeCellRef = inputEl;
    };

    window.updateColHeader = function(cIdx, val) {
      userTables[activeTableIndex].headers[cIdx] = val;
      syncDataToCloud();
    };

    window.updateCellValue = function(rIdx, cIdx, val) {
      if (!userTables[activeTableIndex].rows[rIdx]) userTables[activeTableIndex].rows[rIdx] = [];
      userTables[activeTableIndex].rows[rIdx][cIdx] = val;
      syncDataToCloud();
    };

    // Table Renaming and Custom Modal Deletion
    window.openRenameTableModal = function() {
      const curTable = userTables[activeTableIndex];
      if (!curTable) return;
      document.getElementById('rename-table-input').value = curTable.name;
      document.getElementById('rename-table-modal').classList.add('active');
    };

    window.closeRenameTableModal = () => document.getElementById('rename-table-modal').classList.remove('active');

    window.saveRenamedTable = function(e) {
      e.preventDefault();
      const newTitle = document.getElementById('rename-table-input').value.trim();
      if (!newTitle) return;
      userTables[activeTableIndex].name = newTitle;
      closeRenameTableModal();
      renderTabs();
      showNotification("Table title updated!");
      syncDataToCloud();
    };

    window.confirmDeleteCurrentTable = function() {
      const tableName = userTables[activeTableIndex] ? userTables[activeTableIndex].name : "this table";
      
      openConfirmModal(
        "Delete Table",
        `Are you sure you want to delete "${tableName}"? This action cannot be undone.`,
        function() {
          if (userTables.length <= 1) {
            userTables = JSON.parse(JSON.stringify(defaultTables));
            activeTableIndex = 0;
            renderTabs();
            renderSheetsGrid();
            showNotification("Table reset to default!");
            syncDataToCloud();
          } else {
            userTables.splice(activeTableIndex, 1);
            activeTableIndex = Math.max(0, activeTableIndex - 1);
            renderTabs();
            renderSheetsGrid();
            showNotification("Table deleted!");
            syncDataToCloud();
          }
        }
      );
    };

    // Row & Column Addition and Removal
    window.addNewRow = function() {
      const curTable = userTables[activeTableIndex];
      const newRow = new Array(curTable.headers.length).fill("");
      curTable.rows.push(newRow);
      renderSheetsGrid();
      showNotification("New row added");
      syncDataToCloud();
    };

    window.removeLastRow = function() {
      const curTable = userTables[activeTableIndex];
      if (curTable.rows.length <= 1) {
        showNotification("Cannot remove the last remaining row!");
        return;
      }
      curTable.rows.pop();
      renderSheetsGrid();
      showNotification("Last row removed");
      syncDataToCloud();
    };

    window.addNewCol = function() {
      const curTable = userTables[activeTableIndex];
      const colLetter = String.fromCharCode(65 + (curTable.headers.length % 26));
      curTable.headers.push(colLetter);
      curTable.rows.forEach(r => r.push(""));
      renderSheetsGrid();
      showNotification("New column added");
      syncDataToCloud();
    };

    window.removeLastCol = function() {
      const curTable = userTables[activeTableIndex];
      if (curTable.headers.length <= 1) {
        showNotification("Cannot remove the last remaining column!");
        return;
      }
      curTable.headers.pop();
      curTable.rows.forEach(r => r.pop());
      renderSheetsGrid();
      showNotification("Last column removed");
      syncDataToCloud();
    };

    // Cell Color Highlighting
    window.openPresetModal = function() {
      if (!activeCellRef) {
        showNotification("Tap a cell first to highlight!");
        return;
      }
      document.getElementById('preset-modal').classList.add('active');
    };

    window.closePresetModal = () => document.getElementById('preset-modal').classList.remove('active');

    window.applyDirectPreset = function(tagClass) {
      if (!activeCellRef) return;
      const cellId = activeCellRef.id;
      const curTable = userTables[activeTableIndex];

      activeCellRef.classList.remove('tag-purple', 'tag-amber', 'tag-indigo', 'tag-emerald');
      if (tagClass) {
        activeCellRef.classList.add(tagClass);
        curTable.tags[cellId] = tagClass;
      } else {
        delete curTable.tags[cellId];
      }

      closePresetModal();
      showNotification("Cell highlight updated!");
      syncDataToCloud();
    };

    window.clearActiveCell = function() {
      if (!activeCellRef) {
        showNotification("Tap a cell to clear!");
        return;
      }
      activeCellRef.value = '';
      const cellId = activeCellRef.id;
      const parts = cellId.split('_');
      const rIdx = parseInt(parts[1]);
      const cIdx = parseInt(parts[2]);

      const curTable = userTables[activeTableIndex];
      if (curTable.rows[rIdx]) curTable.rows[rIdx][cIdx] = '';
      activeCellRef.className = 'cell-input';
      delete curTable.tags[cellId];

      showNotification("Cell cleared.");
      syncDataToCloud();
    };

    // New Table Sheet Creation
    window.closeNewTableModal = () => document.getElementById('new-table-modal').classList.remove('active');

    window.createNewTable = function(e) {
      e.preventDefault();
      const tableName = document.getElementById('table-name-input').value.trim();
      if (!tableName) return;

      const newTbl = {
        id: "tab_" + Date.now(),
        name: tableName,
        headers: ["Time", "Day", "Course", "Venue"],
        rows: [
          ["", "", "", ""],
          ["", "", "", ""],
          ["", "", "", ""],
          ["", "", "", ""],
          ["", "", "", ""]
        ],
        tags: {}
      };

      userTables.push(newTbl);
      activeTableIndex = userTables.length - 1;
      document.getElementById('table-name-input').value = '';
      closeNewTableModal();
      renderTabs();
      renderSheetsGrid();
      showNotification("New table created!");
      syncDataToCloud();
    };

    // Countdowns Engine with Custom Confirm Modal
    window.openAddEventModal = (editIndex = -1) => {
      document.getElementById('event-edit-index').value = editIndex;
      if (editIndex >= 0) {
        document.getElementById('event-modal-title').innerText = "Edit Countdown Event";
        document.getElementById('event-name-input').value = countdownEvents[editIndex].name;
        
        const d = new Date(countdownEvents[editIndex].timestamp);
        const pad = n => String(n).padStart(2, '0');
        const localIso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        document.getElementById('event-date-input').value = localIso;
      } else {
        document.getElementById('event-modal-title').innerText = "Add Countdown Event";
        document.getElementById('event-name-input').value = "";
        document.getElementById('event-date-input').value = "";
      }
      document.getElementById('event-modal').classList.add('active');
    };

    window.closeEventModal = () => document.getElementById('event-modal').classList.remove('active');

    window.saveCountdownEvent = async function(e) {
      e.preventDefault();
      const name = document.getElementById('event-name-input').value.trim();
      const dateVal = document.getElementById('event-date-input').value;
      const editIndex = parseInt(document.getElementById('event-edit-index').value);

      if (!dateVal) return;
      const timestamp = new Date(dateVal).getTime();

      if (editIndex >= 0) {
        countdownEvents[editIndex] = { name, timestamp };
      } else {
        countdownEvents.push({ name, timestamp });
      }

      closeEventModal();
      renderCountdowns();
      showNotification("Event countdown saved!");
      await syncDataToCloud();
    };

    window.deleteCountdownEvent = function(index) {
      const eventName = countdownEvents[index] ? countdownEvents[index].name : "this event";
      openConfirmModal(
        "Delete Event",
        `Are you sure you want to delete the event "${eventName}"?`,
        async function() {
          countdownEvents.splice(index, 1);
          renderCountdowns();
          showNotification("Event deleted.");
          await syncDataToCloud();
        }
      );
    };

    function renderCountdowns() {
      const container = document.getElementById('countdown-cards-container');
      if (!countdownEvents || countdownEvents.length === 0) {
        container.innerHTML = `<div style="font-size:0.75rem; color:var(--text-muted); background:var(--card-bg); padding:1rem; border-radius:var(--radius-sm); text-align:center; border:1px dashed var(--border-color);">No active countdown events. Click "Add Event" above.</div>`;
        return;
      }

      container.innerHTML = '';
      countdownEvents.forEach((ev, idx) => {
        const card = document.createElement('div');
        card.className = 'countdown-card';
        card.id = `cd-card-${idx}`;
        card.innerHTML = `
          <div id="cd-status-${idx}" class="countdown-status-msg" style="display: none;"></div>
          <div class="countdown-card-top">
            <span class="countdown-title">${ev.name}</span>
            <div class="countdown-actions-group">
              <button class="event-chip-btn" onclick="openAddEventModal(${idx})">Edit</button>
              <button class="event-chip-btn" onclick="deleteCountdownEvent(${idx})">Delete</button>
            </div>
          </div>
          <div class="countdown-timers" id="cd-timer-${idx}">
            <div class="time-box"><div class="time-val" id="cd-${idx}-d">00</div><div class="time-lbl">Days</div></div>
            <div class="time-box"><div class="time-val" id="cd-${idx}-h">00</div><div class="time-lbl">Hours</div></div>
            <div class="time-box"><div class="time-val" id="cd-${idx}-m">00</div><div class="time-lbl">Mins</div></div>
            <div class="time-box"><div class="time-val" id="cd-${idx}-s">00</div><div class="time-lbl">Secs</div></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    setInterval(() => {
      const now = new Date().getTime();
      countdownEvents.forEach((ev, idx) => {
        const distance = ev.timestamp - now;
        const dEl = document.getElementById(`cd-${idx}-d`);
        const hEl = document.getElementById(`cd-${idx}-h`);
        const mEl = document.getElementById(`cd-${idx}-m`);
        const sEl = document.getElementById(`cd-${idx}-s`);
        const cardEl = document.getElementById(`cd-card-${idx}`);
        const statusEl = document.getElementById(`cd-status-${idx}`);

        if (!dEl || !cardEl || !statusEl) return;

        if (distance <= 0) {
          dEl.innerText = "00"; hEl.innerText = "00"; mEl.innerText = "00"; sEl.innerText = "00";
          cardEl.className = "countdown-card expired";
          statusEl.innerText = "🔴 Event has already ended!";
          statusEl.style.display = "inline-block";
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((distance % (1000 * 60)) / 1000);

        dEl.innerText = String(days).padStart(2, '0');
        hEl.innerText = String(hours).padStart(2, '0');
        mEl.innerText = String(mins).padStart(2, '0');
        sEl.innerText = String(secs).padStart(2, '0');

        if (days === 0 && hours === 0) {
          cardEl.className = "countdown-card urgent";
          statusEl.innerText = "⚡ Less than 1 hour remaining!";
          statusEl.style.display = "inline-block";
        } else if (days === 0) {
          cardEl.className = "countdown-card urgent";
          statusEl.innerText = "⚠️ Less than 24 hours remaining!";
          statusEl.style.display = "inline-block";
        } else {
          cardEl.className = "countdown-card";
          statusEl.style.display = "none";
        }
      });
    }, 1000);

    // DUAL-PERSISTENCE: LOCALSTORAGE + FIRESTORE SETDOC MERGE
    async function syncDataToCloud() {
      // 1. Instant Local Storage Save
      try {
        localStorage.setItem('yandli_userTables', JSON.stringify(userTables));
        localStorage.setItem('yandli_countdowns', JSON.stringify(countdownEvents));
      } catch (err) {
        console.error("Local storage save error:", err);
      }

      // 2. Cloud Firestore Save
      if (!currentUserUid) return;
      try {
        const userRef = doc(db, "Users", currentUserUid);
        await setDoc(userRef, {
          userTables: userTables,
          countdownEvents: countdownEvents
        }, { merge: true });
      } catch (err) {
        console.error("Cloud sync error:", err);
      }
    }

    // Initialize View Immediately from Local Storage
    renderTabs();
    renderSheetsGrid();
    renderCountdowns();

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserUid = user.uid;
        try {
          const docSnap = await getDoc(doc(db, "Users", user.uid));
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.userTables && Array.isArray(data.userTables) && data.userTables.length > 0) {
              userTables = data.userTables;
              localStorage.setItem('yandli_userTables', JSON.stringify(userTables));
            }
            if (data.countdownEvents) {
              countdownEvents = data.countdownEvents;
              localStorage.setItem('yandli_countdowns', JSON.stringify(countdownEvents));
            }
            renderTabs();
            renderSheetsGrid();
            renderCountdowns();
          } else {
            // First time user document setup
            await syncDataToCloud();
          }
        } catch (err) {
          console.error("Error fetching cloud data:", err);
        }
      } else {
        window.location.href = "index.html";
      }
    });
  </script>

            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('New update available! Reloading...');
              }
            };
          };
        })
        .catch((err) => console.error('ServiceWorker registration failed:', err));
    });
  }
</script>
