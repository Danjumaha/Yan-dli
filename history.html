<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yan-Dli | Practice History</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#8B5CF6;--primary-dark:#7C3AED;--primary-light:#F3E8FF;--bg-body:#F8FAFC;--card-bg:#FFFFFF;--text-main:#0F172A;--text-sub:#64748B;--border:#E2E8F0;--success:#10B981;--success-light:#D1FAE5;--danger:#EF4444;--danger-light:#FEE2E2;--warning:#F59E0B;--warning-light:#FEF3C7;--radius-app:20px;--radius-btn:12px;--shadow-card:0 4px 16px -2px rgba(139, 92, 246, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.02);--font-family:'Plus Jakarta Sans',-apple-system,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-family);-webkit-tap-highlight-color:transparent;}
    body{background-color:var(--bg-body);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;align-items:center;}
    
    .app-shell{
      width:100%;
      max-width:480px;
      height:100vh;
      max-height:930px;
      background-color:#FFFFFF;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
      box-shadow:0 25px 50px -12px rgba(15,23,42,0.15);
    }
    @media (min-width: 500px) {
      .app-shell{height:92vh;border-radius:32px;border:6px solid #0F172A;}
    }

    .app-header{
      padding:14px 16px 12px;
      background:#FFFFFF;
      border-bottom:1px solid #F1F5F9;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
    }
    .header-left-group{display:flex;align-items:center;gap:10px;}

    .back-btn{
      width:38px;height:38px;border-radius:50%;background:#F8FAFC;color:var(--text-main);
      border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:all 0.2s ease;
    }
    .back-btn:hover{background:var(--primary-light);border-color:var(--primary-dark);color:var(--primary-dark);}
    .back-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}

    .app-header-title{font-size:0.95rem;font-weight:800;color:var(--text-main);}
    .app-header-subtitle{font-size:0.68rem;color:var(--text-sub);font-weight:600;}

    /* VIEW CONTROL BAR (When inside a specific date folder) */
    .view-control-bar{
      padding:10px 16px;background:#FFFFFF;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
    }
    .active-date-label{font-size:0.85rem;font-weight:800;color:var(--text-main);}
    .change-date-btn{
      background:var(--primary-light);color:var(--primary-dark);border:1px solid rgba(139,92,246,0.2);
      padding:5px 12px;border-radius:20px;font-size:0.72rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all 0.2s;
    }
    .change-date-btn:hover{background:#EDE9FE;}
    .change-date-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none;}

    .app-content{
      flex:1;overflow-y:auto;padding:12px 16px 80px;scroll-behavior:smooth;display:flex;flex-direction:column;gap:10px;
    }

    /* DATE FOLDER CARDS */
    .date-folder-card{
      background:var(--card-bg);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;
      display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all 0.2s ease;box-shadow:var(--shadow-card);
    }
    .date-folder-card:hover{border-color:var(--primary);background:var(--primary-light);}
    .folder-left{display:flex;align-items:center;gap:12px;}
    .folder-icon-box{
      width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary-dark);
      display:flex;align-items:center;justify-content:center;
    }
    .date-folder-card:hover .folder-icon-box{background:#FFFFFF;}
    .folder-title{font-size:0.85rem;font-weight:800;color:var(--text-main);}
    .folder-sub{font-size:0.68rem;color:var(--text-sub);font-weight:600;}
    .folder-badge{background:var(--primary);color:#FFFFFF;font-size:0.68rem;font-weight:800;padding:3px 10px;border-radius:20px;}

    /* SESSION CARD STYLING */
    .session-card{
      background:var(--card-bg);border-radius:14px;padding:12px;border:1px solid var(--border);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:10px;
    }
    .session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
    .course-title{font-size:0.82rem;font-weight:800;color:var(--text-main);line-height:1.3;word-break:break-word;}
    .time-sub{font-size:0.65rem;color:var(--text-sub);font-weight:600;margin-top:2px;}
    .session-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .score-pill{font-size:0.7rem;font-weight:800;padding:3px 8px;border-radius:8px;}
    .score-pill.high{background:var(--success-light);color:var(--success);}
    .score-pill.mid{background:var(--warning-light);color:var(--warning);}
    .score-pill.low{background:var(--danger-light);color:var(--danger);}
    
    .btn-delete-card{background:none;border:none;color:var(--text-sub);cursor:pointer;padding:4px;opacity:0.7;transition:all 0.2s;border-radius:6px;display:flex;align-items:center;justify-content:center;}
    .btn-delete-card:hover{opacity:1;color:var(--danger);background:var(--danger-light);}
    .btn-delete-card svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}

    .session-stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#F8FAFC;border-radius:10px;padding:8px;border:1px solid #EDF2F7;}
    .stat-cell{display:flex;flex-direction:column;align-items:center;}
    .stat-cell-lbl{font-size:0.6rem;color:var(--text-sub);font-weight:700;text-transform:uppercase;}
    .stat-cell-val{font-size:0.78rem;font-weight:800;color:var(--text-main);margin-top:1px;}

    .session-actions{display:flex;gap:8px;}
    .action-btn{flex:1;height:34px;border-radius:10px;font-size:0.74rem;font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:all 0.2s ease;}
    .btn-review{background:var(--primary-light);color:var(--primary-dark);}
    .btn-review:active{transform:scale(0.97);}
    .btn-retry{background:var(--primary);color:white;box-shadow:0 4px 12px rgba(139,92,246,0.2);}
    .btn-retry:active{transform:scale(0.97);}
    .action-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;}

    /* EMPTY & LOADING STATES */
    .empty-state{text-align:center;padding:3rem 1rem;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-sub);}
    .empty-icon{
      width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);
      display:flex;align-items:center;justify-content:center;margin-bottom:2px;
    }
    .loading-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;margin:0 auto 10px;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* CUSTOM CONFIRMATION MODAL */
    .modal-overlay{
      position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(15,23,42,0.5);z-index:200;
      display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:1rem;
    }
    .modal-overlay.active{display:flex;}
    .modal-box{
      background:var(--card-bg);width:100%;max-width:340px;border-radius:var(--radius-app);padding:1.25rem;
      box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);display:flex;flex-direction:column;gap:10px;
    }
    .modal-title{font-size:0.9rem;font-weight:800;color:var(--text-main);}
    .modal-desc{font-size:0.76rem;color:var(--text-sub);line-height:1.4;font-weight:500;}
    .modal-actions{display:flex;gap:8px;margin-top:8px;}
    .btn-secondary{
      flex:1;background:var(--bg-body);border:1.5px solid var(--border);color:var(--text-main);
      padding:10px;border-radius:var(--radius-btn);font-weight:700;cursor:pointer;font-size:0.78rem;
    }
    .btn-danger{
      flex:1;background:var(--danger);border:none;color:#FFF;
      padding:10px;border-radius:var(--radius-btn);font-weight:700;cursor:pointer;font-size:0.78rem;
      box-shadow:0 4px 12px rgba(239,68,68,0.25);
    }

    .bottom-nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#FFFFFF;
      border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;z-index:30;
    }
    .btn-bottom-cta{
      width:100%;height:40px;border-radius:var(--radius-btn);background:var(--primary);color:white;font-size:0.78rem;
      font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
      box-shadow:0 4px 12px rgba(139,92,246,0.25);
    }
    .btn-bottom-cta svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;}
  </style>
</head>
<body>
<div class="app-shell">
  <!-- APP HEADER -->
  <header class="app-header">
    <div class="header-left-group">
      <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div>
        <h1 class="app-header-title">Practice History</h1>
        <p class="app-header-subtitle" id="header-subtitle">Loading records...</p>
      </div>
    </div>
  </header>

  <!-- VIEW CONTROL BAR (Appears only when inside a date folder) -->
  <div id="view-control-bar" class="view-control-bar" style="display: none;">
    <span class="active-date-label" id="active-date-title">October 20, 2026</span>
    <button type="button" class="change-date-btn" onclick="backToDateFolders()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Change Date
    </button>

  <!-- CONTENT CONTAINER -->
  <main class="app-content" id="history-content-container">

<!-- CUSTOM DELETE CONFIRMATION MODAL -->
<div class="modal-overlay" id="delete-modal">

    <div class="modal-actions">

      <button class="btn-danger" onclick="confirmDeleteSession()">Yes, Delete</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
  authDomain: "yan-dli.firebaseapp.com",
  databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
  projectId: "yan-dli",
  storageBucket: "yan-dli.firebasestorage.app",
  messagingSenderId: "538794949165",
  appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let historyRecords = [];
let currentSelectedDate = null; // null = viewing date folders list
let sessionToDelete = null;
let currentUserId = null;

const getLocalHistoryKey = uid => `yan_exam_history_${uid}`;
const getPendingSyncKey = uid => `yan_exam_pending_sync_${uid}`;
const getTombstoneKey = uid => `yan_exam_deleted_tombstones_${uid}`;
const getCanonicalSessionKey = (uid, sessionId) => `yan_exam_session_${uid}_${sessionId}`;

function safeParse(value) { try { return JSON.parse(value); } catch { return null; } }
function safeLocalSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
function safeLocalGet(key) { try { return safeParse(localStorage.getItem(key)); } catch { return null; } }
function safeLocalRemove(key) { try { localStorage.removeItem(key); } catch {} }

function getTombstones(uid) {
  const data = safeLocalGet(getTombstoneKey(uid));
  return Array.isArray(data) ? new Set(data) : new Set();
}

function addTombstone(uid, sessionId) {
  if (!uid || !sessionId) return;
  const tombstones = getTombstones(uid);
  tombstones.add(String(sessionId));
  safeLocalSet(getTombstoneKey(uid), Array.from(tombstones));
}

function escapeHTML(value) {
  if (value == null) return "";
  return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function getQuestions(record) {
  if (!record) return [];
  const candidates = [record.questionsData, record.questions, record.questionData, record.questionList, record.items, record.examQuestions, record.questionBank];
  for (const v of candidates) if (Array.isArray(v) && v.length) return v;
  return [];
}

function getAnswers(record) {
  if (!record) return {};
  const candidates = [record.userAnswers, record.selectedAnswers, record.answers, record.responses, record.answerMap, record.studentAnswers];
  for (const v of candidates) if (v && typeof v === "object" && !Array.isArray(v)) return v;
  return {};
}

function getRecordTime(record) {
  if (!record) return 0;
  const values = [record.submittedAt, record.completedAt, record.finishedAt, record.timestamp, record.createdAt, record.updatedAt];
  for (const v of values) {
    if (!v) continue;
    if (typeof v === "object" && typeof v.toDate === "function") {
      const t = v.toDate().getTime();
      if (!Number.isNaN(t)) return t;
    }
    if (typeof v === "object" && v.seconds != null) {
      const t = Number(v.seconds) * 1000;
      if (!Number.isNaN(t)) return t;
    }
    if (typeof v === "number") return v > 10000000000 ? v : v * 1000;
    if (typeof v === "string") {
      const t = new Date(v).getTime();
      if (!Number.isNaN(t)) return t;
    }
  }
  return 0;
}

function getStableRecordId(record) {
  if (!record) return `session_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  const possibleIds = [record.sessionId, record.examSessionId, record.attemptId, record.historyId, record.recordId, record.id];
  for (const v of possibleIds) if (v !== undefined && v !== null && String(v).trim()) return String(v);
  const t = getRecordTime(record);
  if (t) return `session_${t}`;
  return `session_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
}

function normalizeAnswer(value) {
  if (value === undefined || value === null || value === "") return null;
  if (typeof value === "number") return value;
  const text = String(value).trim().toUpperCase();
  const letters = ["A", "B", "C", "D", "E"];
  if (letters.includes(text)) return letters.indexOf(text);
  const num = parseInt(text, 10);
  return Number.isNaN(num) ? null : num;
}

function getQuestionCorrectAnswer(q) {
  if (!q) return null;
  const values = [q.correctAnswer, q.answer, q.correctIndex, q.correctOption, q.correct, q.answerIndex, q.correctAnswerIndex];
  for (const v of values) {
    if (v !== undefined && v !== null) {
      const norm = normalizeAnswer(v);
      if (norm !== null) return norm;
      if (typeof v === "string") return v.trim();
    }
  }
  return null;
}

function getQuestionSelectedAnswer(session, q, index) {
  if (q) {
    const directValues = [q.userSelected, q.selectedAnswer, q.userAnswer, q.studentAnswer];
    for (const v of directValues) {
      if (v !== undefined && v !== null && v !== "") {
        const norm = normalizeAnswer(v);
        if (norm !== null) return norm;
        if (typeof v === "string") return v.trim();
      }
    }
  }
  const answers = getAnswers(session);
  const possibleKeys = [index, String(index), index + 1, String(index + 1)];
  for (const key of possibleKeys) {
    if (Object.prototype.hasOwnProperty.call(answers, key)) {
      const val = answers[key];
      if (val !== undefined && val !== null && val !== "") {
        const norm = normalizeAnswer(val);
        if (norm !== null) return norm;
        if (typeof val === "string") return val.trim();
      }
    }
  }
  return null;
}

function compareAnswers(userAns, correctAns) {
  if (userAns === null || correctAns === null) return false;
  if (userAns === correctAns) return true;
  if (typeof userAns === "number" && typeof correctAns === "string") {
    const letters = ["A", "B", "C", "D", "E"];
    if (letters[userAns] && letters[userAns].toUpperCase() === correctAns.toUpperCase()) return true;
  }
  if (typeof correctAns === "number" && typeof userAns === "string") {
    const letters = ["A", "B", "C", "D", "E"];
    if (letters[correctAns] && letters[correctAns].toUpperCase() === userAns.toUpperCase()) return true;
  }
  if (typeof userAns === "string" && typeof correctAns === "string") {
    return userAns.toUpperCase() === correctAns.toUpperCase();
  }
  return false;
}

function calculateCorrect(session) {
  const qs = getQuestions(session);
  let correct = 0;
  qs.forEach((q, i) => {
    if (compareAnswers(getQuestionSelectedAnswer(session, q, i), getQuestionCorrectAnswer(q))) correct++;
  });
  return correct;
}

function normalizeSession(record) {
  if (!record || typeof record !== "object") return null;
  const qs = getQuestions(record);
  const ans = getAnswers(record);
  const total = Number(record.totalQuestions ?? record.total ?? qs.length ?? 0);
  const hasPrecomputed = record.correctAnswersCount !== undefined || record.correctCount !== undefined;
  const preCorrect = Number(record.correctAnswersCount ?? record.correctCount ?? 0);
  const correct = (hasPrecomputed && preCorrect > 0) ? preCorrect : calculateCorrect(record);
  const score = record.scorePercentage !== undefined ? Number(record.scorePercentage) : record.score !== undefined ? Number(record.score) : total > 0 ? Math.round((correct / total) * 100) : 0;
  const id = getStableRecordId(record);
  return {
    ...record, id, sessionId: record.sessionId || record.examSessionId || id, userId: record.userId || currentUserId,
    questionsData: qs, questions: qs, userAnswers: ans, selectedAnswers: ans, totalQuestions: total,
    correctCount: correct, correctAnswersCount: correct, score, scorePercentage: score
  };
}

function isValidHistoryRecord(record) {
  if (!record || typeof record !== "object") return false;
  if (currentUserId) {
    const tombstones = getTombstones(currentUserId);
    const id = getStableRecordId(record);
    if (tombstones.has(String(id))) return false;
    if (record.userId && String(record.userId) !== String(currentUserId)) return false;
  }
  const qs = getQuestions(record);
  return qs.length > 0 || record.scorePercentage !== undefined || record.score !== undefined;
}

function mergeSessionRecords(first, second) {
  if (!first) return normalizeSession(second);
  if (!second) return normalizeSession(first);
  const fNorm = normalizeSession(first), sNorm = normalizeSession(second);
  const base = sNorm > fNorm ? { ...fNorm, ...sNorm } : { ...sNorm, ...fNorm };
  base.id = getStableRecordId(fNorm) || getStableRecordId(sNorm);
  base.sessionId = fNorm.sessionId || sNorm.sessionId || base.id;
  base.userId = currentUserId;
  return normalizeSession(base);
}

function addRecordToMap(map, record) {
  if (!record || typeof record !== "object") return;
  const normalized = normalizeSession({ ...record, userId: record.userId || currentUserId });
  if (!normalized || !isValidHistoryRecord(normalized)) return;
  const id = getStableRecordId(normalized);
  const existing = map.get(String(id));
  if (existing) map.set(String(id), mergeSessionRecords(existing, normalized));
  else map.set(String(id), normalized);
}

function readLocalHistory(uid) {
  const records = [];
  const tombstones = getTombstones(uid);
  const data = safeLocalGet(getLocalHistoryKey(uid));
  if (Array.isArray(data)) {
    data.forEach(r => {
      const id = getStableRecordId(r);
      if (!tombstones.has(String(id)) && (!r.userId || String(r.userId) === String(uid))) {
        records.push({ ...r, userId: r.userId || uid });
      }
    });
  }
  return records;
}

function readCanonicalSessions(uid) {
  const records = [];
  const tombstones = getTombstones(uid);
  const prefix = `yan_exam_session_${uid}_`;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith(prefix)) continue;
      const data = safeLocalGet(key);
      if (data && typeof data === "object") {
        const id = getStableRecordId(data);
        if (!tombstones.has(String(id)) && (!data.userId || String(data.userId) === String(uid))) {
          records.push({ ...data, userId: data.userId || uid });
        }
      }
    }
  } catch (e) {}
  return records;
}

function readPendingSync(uid) {
  const data = safeLocalGet(getPendingSyncKey(uid));
  const tombstones = getTombstones(uid);
  return Array.isArray(data) ? data.filter(r => !tombstones.has(String(getStableRecordId(r)))) : [];
}

function saveLocalHistory(uid, records) {
  const tombstones = getTombstones(uid);
  const normalized = records.map(r => normalizeSession(r)).filter(Boolean).filter(r => !tombstones.has(String(getStableRecordId(r))) && (!r.userId || String(r.userId) === String(uid)));
  safeLocalSet(getLocalHistoryKey(uid), normalized);
}

async function fetchFirestoreHistory(uid) {
  if (!navigator.onLine) return [];
  const records = [];
  const tombstones = getTombstones(uid);
  const historyQuery = query(collection(db, "ExamHistory"), where("userId", "==", uid));
  const snapshot = await getDocs(historyQuery);
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const id = data.id || docSnap.id;
    if (tombstones.has(String(id))) return;
    if (data.userId && String(data.userId) !== String(uid)) return;
    records.push({ ...data, id, sessionId: data.sessionId || data.examSessionId || id, userId: uid });
  });
  return records;
}

/**
 * AUTOMATIC SUBJECT IMPROVEMENT DETECTOR & NOTIFIER
 * Calculates score diffs per course/topic and dispatches notifications to Firestore.
 */
async function evaluateAndNotifyImprovement(userId, allRecords) {
  if (!userId || !allRecords || allRecords.length < 2 || !navigator.onLine) return;

  const sortedChronologically = [...allRecords].sort((a, b) => getRecordTime(a) - getRecordTime(b));
  
  // Group score history by Course / Subject
  const courseHistoryMap = {};
  sortedChronologically.forEach(rec => {
    const course = (rec.courseCode || rec.courseTitle || rec.courseName || rec.subject || rec.examTitle || "General Practice").toUpperCase().trim();
    if (!courseHistoryMap[course]) courseHistoryMap[course] = [];
    courseHistoryMap[course].push(rec);
  });

  for (const course in courseHistoryMap) {
    const attempts = courseHistoryMap[course];
    if (attempts.length < 2) continue; // Requires at least 2 attempts to detect improvement

    const latestAttempt = attempts[attempts.length - 1];
    const previousAttempts = attempts.slice(0, attempts.length - 1);

    const latestScore = latestAttempt.scorePercentage ?? latestAttempt.score ?? 0;
    const latestAttemptId = getStableRecordId(latestAttempt);
    const attemptTime = getRecordTime(latestAttempt) || Date.now();
    const dateKey = new Date(attemptTime).toISOString().split('T')[0];

    // Calculate previous average & previous best score
    const prevScores = previousAttempts.map(a => a.scorePercentage ?? a.score ?? 0);
    const prevAverage = Math.round(prevScores.reduce((sum, s) => sum + s, 0) / prevScores.length);
    const prevBest = Math.max(...prevScores);

    const scoreDifference = latestScore - prevAverage;

    // Trigger threshold: latest attempt must be at least 5 points above previous average
    if (scoreDifference >= 5 && latestScore > prevBest) {
      const cooldownKey = `yan_improv_notif_${userId}_${course}_${latestAttemptId}`;
      if (localStorage.getItem(cooldownKey) === "true") continue; // Prevent double notifications

      const title = `📈 Impressive Improvement in ${course}!`;
      const message = `Awesome job! You scored ${latestScore}% in ${course}, which is ${scoreDifference}% higher than your previous average (${prevAverage}%). Keep pushing forward!`;

      try {
        await addDoc(collection(db, "Notifications"), {
          userId: userId,
          title: title,
          message: message,
          type: "success",
          courseCode: course,
          targetDate: dateKey,
          scoreImprovement: scoreDifference,
          newScore: latestScore,
          isRead: false,
          createdAt: new Date().toISOString()
        });

        localStorage.setItem(cooldownKey, "true");
      } catch (err) {
        console.warn("Could not dispatch improvement notification:", err);
      }
    }
  }
}

async function loadAllRecords(userId) {
  if (!userId) return;
  try {
    const localRecords = [...readLocalHistory(userId), ...readCanonicalSessions(userId), ...readPendingSync(userId)];
    const localMap = new Map();
    localRecords.forEach(r => addRecordToMap(localMap, r));
    historyRecords = Array.from(localMap.values()).filter(isValidHistoryRecord).sort((a, b) => getRecordTime(b) - getRecordTime(a));
    
    // Check URL params if navigated directly from a notification (e.g. ?date=2026-10-20)
    const urlParams = new URLSearchParams(window.location.search);
    const targetDateParam = urlParams.get('date');
    if (targetDateParam && !currentSelectedDate) {
      currentSelectedDate = targetDateParam;
    }

    renderCurrentState();

    if (navigator.onLine) {
      try {
        const remoteRecords = await fetchFirestoreHistory(userId);
        const mergedMap = new Map();
        historyRecords.forEach(r => addRecordToMap(mergedMap, r));
        remoteRecords.forEach(r => addRecordToMap(mergedMap, r));
        historyRecords = Array.from(mergedMap.values()).filter(isValidHistoryRecord).sort((a, b) => getRecordTime(b) - getRecordTime(a));
        saveLocalHistory(userId, historyRecords);
      } catch (e) {}
    }

    evaluateAndNotifyImprovement(userId, historyRecords);
    renderCurrentState();
  } catch (e) {
    if (historyRecords.length === 0) {
      showEmptyState("Unable to load practice history.");
    }
  }
}

function renderCurrentState() {
  if (currentSelectedDate) {
    renderSessionsForDate(currentSelectedDate);
  } else {
    renderDateFolders();
  }
}

// GROUP BY STORED DATES (YYYY-MM-DD)
function renderDateFolders() {
  document.getElementById('view-control-bar').style.display = 'none';
  const container = document.getElementById('history-content-container');
  const subtitle = document.getElementById('header-subtitle');

  const dateMap = {};
  historyRecords.forEach(item => {
    const time = getRecordTime(item) || Date.now();
    const d = new Date(time);
    const dateKey = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    if (!dateMap[dateKey]) dateMap[dateKey] = [];
    dateMap[dateKey].push(item);
  });

  const availableDates = Object.keys(dateMap).sort().reverse();
  subtitle.textContent = availableDates.length > 0 ? `${availableDates.length} stored date${availableDates.length > 1 ? 's' : ''}` : 'No history logs';

  if (availableDates.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div style="font-weight: 800; font-size: 0.85rem; color: var(--text-main);">No Practice Records Found</div>
        <div style="font-size: 0.72rem;">Complete a practice test to build your history log.</div>
      </div>
    `;
    return;
  }

  container.innerHTML = availableDates.map(dateStr => {
    const count = dateMap[dateStr].length;
    const formattedDateName = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

    return `
      <div class="date-folder-card" onclick="openDateFolder('${dateStr}')">
        <div class="folder-left">
          <div class="folder-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div>
            <div class="folder-title">${formattedDateName}</div>
            <div class="folder-sub">${count} test attempt${count > 1 ? 's' : ''} stored</div>
          </div>
        </div>
        <div class="folder-badge">${count}</div>
      </div>
    `;
  }).join('');
}

window.openDateFolder = function(dateStr) {
  currentSelectedDate = dateStr;
  renderSessionsForDate(dateStr);
};

window.backToDateFolders = function() {
  currentSelectedDate = null;
  // Clear date query from URL clean
  if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.pathname);
  }
  renderDateFolders();
};

function renderSessionsForDate(dateStr) {
  document.getElementById('view-control-bar').style.display = 'flex';
  const container = document.getElementById('history-content-container');
  const subtitle = document.getElementById('header-subtitle');
  const activeDateTitle = document.getElementById('active-date-title');

  const formattedHeaderDate = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  activeDateTitle.textContent = formattedHeaderDate;

  const filtered = historyRecords.filter(item => {
    const time = getRecordTime(item) || Date.now();
    const d = new Date(time);
    const itemDateStr = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    return itemDateStr === dateStr;
  });

  subtitle.textContent = `${filtered.length} attempt${filtered.length !== 1 ? 's' : ''} on this date`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div style="font-weight: 800; font-size: 0.85rem; color: var(--text-main);">No attempts stored for this date</div>
        <div style="font-size: 0.72rem;">Click "Change Date" above to select another date.</div>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(session => {
    const normalized = normalizeSession(session);
    if (!normalized) return '';
    const qs = getQuestions(normalized);
    const total = Number(normalized.totalQuestions || qs.length || 0);
    const correct = Number(normalized.correctAnswersCount ?? normalized.correctCount ?? calculateCorrect(normalized));
    const score = normalized.scorePercentage !== undefined ? Number(normalized.scorePercentage) : total ? Math.round((correct / total) * 100) : 0;
    const timeSpent = Number(normalized.timeSpentSeconds ?? normalized.durationSeconds ?? normalized.timeSpent ?? normalized.elapsedSeconds ?? 0);
    const mins = Math.floor(timeSpent / 60), secs = timeSpent % 60, avg = total ? Math.round(timeSpent / total) : 0;
    const scoreClass = score >= 70 ? "high" : score >= 50 ? "mid" : "low";
    const recordTime = getRecordTime(normalized);
    const timeString = recordTime ? new Date(recordTime).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }) : "--";
    const course = normalized.courseCode || normalized.courseTitle || normalized.courseName || normalized.subject || normalized.examTitle || "PRACTICE EXAM";
    const mode = normalized.mode || normalized.examMode || "practice";
    const recordId = getStableRecordId(normalized);

    return `
      <div class="session-card">
        <div class="session-head">
          <div>
            <div class="course-title">${escapeHTML(course)}</div>
            <div class="time-sub">Completed at ${escapeHTML(timeString)} • ${escapeHTML(String(mode).toUpperCase())}</div>
          </div>
          <div class="session-head-right">
            <span class="score-pill ${scoreClass}">${score}%</span>
            <button class="btn-delete-card" type="button" onclick="promptDeleteSession('${recordId}', '${escapeHTML(course).replace(/'/g, "\\'")}')" title="Delete Exam Record">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
        <div class="session-stats-grid">
          <div class="stat-cell"><span class="stat-cell-lbl">Score</span><span class="stat-cell-val">${correct}/${total}</span></div>
          <div class="stat-cell"><span class="stat-cell-lbl">Duration</span><span class="stat-cell-val">${mins}m ${secs}s</span></div>
          <div class="stat-cell"><span class="stat-cell-lbl">Pace</span><span class="stat-cell-val">${avg}s/q</span></div>
        </div>
        <div class="session-actions">
          <button class="action-btn btn-review" type="button" onclick="reviewSession('${recordId}')">
            <svg viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            Review Corrections
          </button>
          <button class="action-btn btn-retry" type="button" onclick="window.location.href='exams.html?retake=${encodeURIComponent(recordId)}'">
            <svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9"></path><path d="M20 20v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Retake
          </button>
        </div>
      </div>
    `;
  }).join('');
}

window.reviewSession = function(recordId) {
  if (!currentUserId) { window.location.replace("index.html"); return; }
  const session = historyRecords.find(r => getStableRecordId(r) === recordId);
  if (!session) return;
  const reviewPayload = { ...session, id: recordId, sessionId: recordId, userId: currentUserId, isReviewMode: true };
  try {
    sessionStorage.setItem("yan_review_session", JSON.stringify(reviewPayload));
  } catch (e) {}
  window.location.href = `submit.html?id=${encodeURIComponent(recordId)}`;
};

window.promptDeleteSession = function(recordId, title) {
  sessionToDelete = recordId;
  document.getElementById("modal-desc-text").innerText = `Are you sure you want to delete your ${title} attempt? This will permanently remove it from your history logs.`;
  document.getElementById("delete-modal").classList.add("active");
};

window.closeDeleteModal = function() {
  document.getElementById("delete-modal").classList.remove("active");
  sessionToDelete = null;
};

window.confirmDeleteSession = async function() {
  if (!sessionToDelete || !currentUserId) return;
  const targetId = sessionToDelete;
  
  addTombstone(currentUserId, targetId);
  historyRecords = historyRecords.filter(r => getStableRecordId(r) !== String(targetId));
  saveLocalHistory(currentUserId, historyRecords);
  safeLocalRemove(getCanonicalSessionKey(currentUserId, targetId));
  
  closeDeleteModal();
  renderCurrentState();

  if (navigator.onLine) {
    try {
      await deleteDoc(doc(db, "ExamHistory", String(targetId)));
    } catch (e) {}
  }
};

function showEmptyState(msg) {
  document.getElementById('history-content-container').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div style="font-weight: 800; font-size: 0.85rem; color: var(--text-main);">No Practice Records Found</div>
      <div style="font-size: 0.72rem;">${msg || "You haven't completed any practice attempts yet."}</div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  onAuthStateChanged(auth, async user => {
    if (!user) {
      currentUserId = null;
      window.location.replace("index.html");
      return;
    }
    currentUserId = user.uid;
    
    try {
      const recentExam = sessionStorage.getItem("yan_latest_submitted_exam");
      if (recentExam) {
        sessionStorage.removeItem("yan_latest_submitted_exam");
        const parsed = JSON.parse(recentExam);
        if (parsed && typeof parsed === "object") {
          const normalized = normalizeSession({ ...parsed, userId: user.uid });
          if (normalized && !getTombstones(user.uid).has(String(getStableRecordId(normalized)))) {
            historyRecords.unshift(normalized);
            saveLocalHistory(user.uid, historyRecords);
          }
        }
      }
    } catch (e) {}

    await loadAllRecords(user.uid);
  });
});
</script>
