<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yan-Dli | Leaderboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #F3E8FF;
      --bg-gray: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ECEFF1;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-gray);
      min-height: 100vh;
      position: relative;
      padding-bottom: 90px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    /* TOP NAVBAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-color);
    }

    .top-bar-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .icon-btn {
      background: var(--primary-light);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    /* CONTENT BODY */
    .content-body {
      padding: 1rem;
    }

    /* PERIOD TABS */
    .leaderboard-tabs {
      display: flex;
      background: var(--border-color);
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 3px;
      margin-bottom: 1rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      padding: 7px 0;
      border-radius: 9px;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }

    /* SEARCH BAR */
    .search-container {
      position: relative;
      margin-bottom: 1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 0.85rem 0.65rem 2.4rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--card-bg);
      font-size: 0.85rem;
      color: var(--text-dark);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
    }

    /* RANKINGS LIST TABLE */
    .rankings-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .rank-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .rank-row:last-child {
      border-bottom: none;
    }

    .rank-number {
      width: 40px;
      font-weight: 400;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .rank-row:nth-child(1) .rank-number { color: #D97706; font-weight: 500; }
    .rank-row:nth-child(2) .rank-number { color: #64748B; font-weight: 500; }
    .rank-row:nth-child(3) .rank-number { color: #B45309; font-weight: 500; }

    .rank-user-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-left: 4px;
    }

    .rank-name {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-dark);
      word-break: break-word;
      line-height: 1.3;
    }

    .rank-score {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      text-align: right;
      min-width: 40px;
    }

    .state-message {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* BOTTOM FIXED NAVIGATION BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.4rem 0;
      z-index: 30;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 400;
      gap: 2px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 500;
    }

    .nav-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TOP HEADER -->
    <header class="top-bar">
      <a href="dashboard.html" class="icon-btn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <span class="top-bar-title">Leaderboard</span>
      <div style="width: 34px;"></div>
    </header>

    <!-- CONTENT BODY -->
    <main class="content-body">

      <!-- PERIOD TABS -->
      <div class="leaderboard-tabs">
        <button class="tab-btn active" onclick="switchTab('today')" id="tab-today">Today</button>
        <button class="tab-btn" onclick="switchTab('week')" id="tab-week">This Week</button>
        <button class="tab-btn" onclick="switchTab('month')" id="tab-month">This Month</button>
      </div>

      <!-- SEARCH BAR -->
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-bar" class="search-input" placeholder="Search student name..." oninput="filterLeaderboard()">
      </div>

      <!-- RANKINGS LIST -->
      <div class="rankings-card">
        <div id="rankings-list">
          <div class="state-message">Loading student rankings...</div>
        </div>
      </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span>Home</span>
      </a>
      <a href="exams.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span>Exams</span>
      </a>
      <a href="classroom.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span>
        <span>Classroom</span>
      </a>
      <a href="activate.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span>Activation</span>
      </a>
      <a href="account.html" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <span>Account</span>
      </a>
    </nav>

  </div>

  <!-- LEADERBOARD ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
      authDomain: "yan-dli.firebaseapp.com",
      databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
      projectId: "yan-dli",
      storageBucket: "yan-dli.firebasestorage.app",
      messagingSenderId: "538794949165",
      appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentPeriod = 'today';
    let globalRankingsData = { today: [], week: [], month: [] };

    function safeParse(val) { try { return JSON.parse(val); } catch { return null; } }

    function extractCleanScore(record) {
      if (!record) return 0;
      const val = record.correctAnswersCount ?? record.correctCount ?? record.score;
      if (typeof val === 'number' && !isNaN(val)) return val;
      if (typeof val === 'string') {
        if (val.includes('/')) {
          const n = Number(val.split('/')[0]);
          return isNaN(n) ? 0 : n;
        }
        const n = Number(val);
        if (!isNaN(n)) return n;
      }
      return 0;
    }

    function getTimestamp(record) {
      const t = record.submittedAt || record.completedAt || record.timestamp || record.createdAt;
      if (!t) return Date.now();
      if (typeof t === 'object' && typeof t.toDate === 'function') return t.toDate().getTime();
      if (typeof t === 'object' && t.seconds) return t.seconds * 1000;
      if (typeof t === 'number') return t > 10000000000 ? t : t * 1000;
      const parsed = new Date(t).getTime();
      return isNaN(parsed) ? Date.now() : parsed;
    }

    async function loadGlobalLeaderboard() {
      try {
        let usersMap = {};

        try {
          const usersSnap = await getDocs(collection(db, "Users"));
          usersSnap.forEach(docSnap => {
            const data = docSnap.data();
            let fullName = "";
            if (data.Firstname || data.Lastname) {
              fullName = `${data.Firstname || ""} ${data.Lastname || ""}`.trim();
            } else {
              fullName = data.name || data.fullName || data.userName || (data.Email ? data.Email.split('@')[0] : "");
            }
            if (fullName) {
              usersMap[docSnap.id] = fullName;
              if (data.Email) usersMap[data.Email] = fullName;
            }
          });
        } catch (e) {
          console.warn("Firestore users fetch skipped:", e);
        }

        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.includes("user")) {
            const u = safeParse(localStorage.getItem(key));
            if (u && (u.Firstname || u.name)) {
              const name = `${u.Firstname || ""} ${u.Lastname || ""}`.trim() || u.name;
              if (u.uid) usersMap[u.uid] = name;
              if (u.Email) usersMap[u.Email] = name;
            }
          }
        }

        let allSessions = [];
        try {
          const historySnap = await getDocs(collection(db, "ExamHistory"));
          historySnap.forEach(docSnap => {
            allSessions.push(docSnap.data());
          });
        } catch (e) {}

        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith("yan_exam_history_") || key.startsWith("yan_exam_session_"))) {
            const data = safeParse(localStorage.getItem(key));
            if (Array.isArray(data)) allSessions.push(...data);
            else if (data && typeof data === "object") allSessions.push(data);
          }
        }

        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
        const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek).getTime();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

        let rawToday = {}, rawWeek = {}, rawMonth = {};

        allSessions.forEach(record => {
          if (!record) return;
          const uid = record.userId || record.uid || record.email || "unknown";
          const score = extractCleanScore(record);
          const time = getTimestamp(record);

          let name = record.fullName || record.userName || record.name || usersMap[uid] || usersMap[record.email] || "";
          if (!name || name.toLowerCase() === "student" || name.toLowerCase() === "anonymous") return;

          if (time >= startOfToday) {
            rawToday[name] = (rawToday[name] || 0) + score;
          }
          if (time >= startOfWeek) {
            rawWeek[name] = (rawWeek[name] || 0) + score;
          }
          if (time >= startOfMonth) {
            rawMonth[name] = (rawMonth[name] || 0) + score;
          }
        });

        const mapToList = (obj) => {
          let list = [];
          for (let name in obj) {
            list.push({ name, score: obj[name] });
          }
          list.sort((a, b) => b.score - a.score);
          return list;
        };

        globalRankingsData.today = mapToList(rawToday);
        globalRankingsData.week = mapToList(rawWeek);
        globalRankingsData.month = mapToList(rawMonth);

        renderLeaderboard(globalRankingsData[currentPeriod]);

      } catch (err) {
        console.error("Leaderboard load error:", err);
        document.getElementById('rankings-list').innerHTML = `<div class="state-message">Unable to display leaderboard rankings.</div>`;
      }
    }

    window.renderLeaderboard = function(dataList) {
      const container = document.getElementById('rankings-list');
      container.innerHTML = '';

      if (!dataList || dataList.length === 0) {
        container.innerHTML = `<div class="state-message">No exam records found for this period.</div>`;
        return;
      }

      dataList.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'rank-row';
        row.innerHTML = `
          <div class="rank-number">${index + 1}${getSuffix(index + 1)}</div>
          <div class="rank-user-info">
            <span class="rank-name">${escapeHtml(item.name)}</span>
          </div>
          <div class="rank-score">${item.score}</div>
        `;
        container.appendChild(row);
      });
    }

    function getSuffix(n) {
      const s = ["th", "st", "nd", "rd"], v = n % 100;
      return s[(v - 20) % 10] || s[v] || s[0];
    }

    window.switchTab = function(period) {
      currentPeriod = period;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${period}`).classList.add('active');
      document.getElementById('search-bar').value = '';
      renderLeaderboard(globalRankingsData[period]);
    }

    window.filterLeaderboard = function() {
      const query = document.getElementById('search-bar').value.toLowerCase().trim();
      const currentList = globalRankingsData[currentPeriod];
      if (!query) {
        renderLeaderboard(currentList);
        return;
      }
      const filtered = currentList.filter(item => item.name.toLowerCase().includes(query));
      renderLeaderboard(filtered);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadGlobalLeaderboard();
  </script>
</body>
</html>
