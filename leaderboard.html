<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yan-Dli | Leaderboard</title>
 

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">


 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #F3E8FF;
      --bg-gray: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ECEFF1;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-gray);
      min-height: 100vh;
      position: relative;
      padding-bottom: 30px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    /* TOP NAVBAR */
    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-color);
    }

    .top-bar-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-dark);
      margin-left: 1rem;
    }

    /* Modern OPay-style Back Button */
    .back-btn {
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      background: #F8FAFC; 
      color: var(--text-dark);
      border: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .back-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* CONTENT BODY */
    .content-body {
      padding: 1rem;
    }

    /* PERIOD TABS */
    .leaderboard-tabs {
      display: flex;
      background: var(--border-color);
      padding: 3px;
      border-radius: var(--radius-md);
      gap: 3px;
      margin-bottom: 1rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      padding: 7px 0;
      border-radius: 9px;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }

    /* SEARCH BAR */
    .search-container {
      position: relative;
      margin-bottom: 1rem;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 0.85rem 0.65rem 2.4rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--card-bg);
      font-size: 0.85rem;
      color: var(--text-dark);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
    }

    /* RANKINGS LIST TABLE */
    .rankings-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .rank-row {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .rank-row.highlight-user {
      background: var(--primary-light);
    }

    .rank-row:last-child {
      border-bottom: none;
    }

    .rank-number {
      width: 40px;
      font-weight: 400;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .rank-row:nth-child(1) .rank-number { color: #D97706; font-weight: 500; }
    .rank-row:nth-child(2) .rank-number { color: #64748B; font-weight: 500; }
    .rank-row:nth-child(3) .rank-number { color: #B45309; font-weight: 500; }

    .rank-user-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-left: 4px;
    }

    .rank-name {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-dark);
      word-break: break-word;
      line-height: 1.3;
    }

    .rank-score {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      text-align: right;
      min-width: 40px;
    }

    .state-message {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- TOP HEADER WITH OPAY-STYLE BACK ARROW -->
    <header class="top-bar">
      <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <span class="top-bar-title">Leaderboard </span>
    </header>

    <!-- CONTENT BODY -->
    <main class="content-body">

      <!-- PERIOD TABS -->
      <div class="leaderboard-tabs">
        <button class="tab-btn active" onclick="switchTab('today')" id="tab-today">Today</button>
        <button class="tab-btn" onclick="switchTab('week')" id="tab-week">This Week</button>
        <button class="tab-btn" onclick="switchTab('month')" id="tab-month">This Month</button>
      </div>

      <!-- SEARCH BAR -->
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-bar" class="search-input" placeholder="Search student name..." oninput="filterLeaderboard()">
      </div>

      <!-- RANKINGS LIST -->
      <div class="rankings-card">
        <div id="rankings-list">
          <div class="state-message">Loading student rankings...</div>
        </div>
      </div>

    </main>

  </div>

  <!-- LEADERBOARD ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
      authDomain: "yan-dli.firebaseapp.com",
      databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
      projectId: "yan-dli",
      storageBucket: "yan-dli.firebasestorage.app",
      messagingSenderId: "538794949165",
      appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentPeriod = 'today';
    let globalRankingsData = { today: [], week: [], month: [] };
    let currentAuthUser = null;

    function safeParse(val) { try { return JSON.parse(val); } catch { return null; } }

    function extractCleanScore(record) {
      if (!record) return 0;
      const val = record.correctAnswersCount ?? record.correctCount ?? record.score;
      if (typeof val === 'number' && !isNaN(val)) return val;
      if (typeof val === 'string') {
        if (val.includes('/')) {
          const n = Number(val.split('/')[0]);
          return isNaN(n) ? 0 : n;
        }
        const n = Number(val);
        if (!isNaN(n)) return n;
      }
      return 0;
    }

    function getTimestamp(record) {
      const t = record.submittedAt || record.completedAt || record.timestamp || record.createdAt;
      if (!t) return Date.now();
      if (typeof t === 'object' && typeof t.toDate === 'function') return t.toDate().getTime();
      if (typeof t === 'object' && t.seconds) return t.seconds * 1000;
      if (typeof t === 'number') return t > 10000000000 ? t : t * 1000;
      const parsed = new Date(t).getTime();
      return isNaN(parsed) ? Date.now() : parsed;
    }

    async function dispatchNotification(userId, title, message, type = 'success') {
      try {
        await addDoc(collection(db, "Notifications"), {
          userId: userId,
          title: title,
          message: message,
          type: type,
          isRead: false,
          createdAt: new Date().toISOString()
        });
      } catch (e) {
        console.warn("Could not dispatch notification:", e);
      }
    }

    async function checkRankMilestones(userId, currentName, newRank, period) {
      if (!userId || newRank > 50) return; // Only track top 50
      
      const todayDateStr = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
      const cooldownKey = `yan_notif_sent_${userId}_${period}_${newRank}_${todayDateStr}`;
      
      // Prevent duplicate notification dispatch on the same day for the same rank milestone
      if (localStorage.getItem(cooldownKey) === "true") {
        return;
      }

      const storageKey = `yan_last_rank_${userId}_${period}`;
      const previousRank = parseInt(localStorage.getItem(storageKey) || "999", 10);

      if (previousRank === 999) {
        // First time entering top 50
        await dispatchNotification(
          userId,
          "🏆 Amazing! You made the Top 50",
          `Congratulations ${currentName}! You are now ranked #${newRank} on the ${period} leaderboard. Keep up the momentum!`,
          "success"
        );
        localStorage.setItem(cooldownKey, "true");
      } else if (newRank < previousRank) {
        // Improved rank
        await dispatchNotification(
          userId,
          "📈 Leaderboard Rank Up!",
          `Great progress, ${currentName}! You climbed from #${previousRank} to #${newRank} on the ${period} leaderboard.`,
          "success"
        );
        localStorage.setItem(cooldownKey, "true");
      }
      
      localStorage.setItem(storageKey, newRank.toString());
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentAuthUser = user;
      }
      loadGlobalLeaderboard();
    });

    async function loadGlobalLeaderboard() {
      try {
        let usersMap = {};
        let currentUserName = "";

        try {
          const usersSnap = await getDocs(collection(db, "Users"));
          usersSnap.forEach(docSnap => {
            const data = docSnap.data();
            let fullName = "";
            if (data.Firstname || data.Lastname) {
              fullName = `${data.Firstname || ""} ${data.Lastname || ""}`.trim();
            } else {
              fullName = data.name || data.fullName || data.userName || (data.Email ? data.Email.split('@')[0] : "");
            }
            if (fullName) {
              usersMap[docSnap.id] = fullName;
              if (currentAuthUser && docSnap.id === currentAuthUser.uid) {
                currentUserName = fullName;
              }
              if (data.Email) usersMap[data.Email] = fullName;
            }
          });
        } catch (e) {
          console.warn("Firestore users fetch skipped:", e);
        }

        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.includes("user")) {
            const u = safeParse(localStorage.getItem(key));
            if (u && (u.Firstname || u.name)) {
              const name = `${u.Firstname || ""} ${u.Lastname || ""}`.trim() || u.name;
              if (u.uid) usersMap[u.uid] = name;
              if (u.Email) usersMap[u.Email] = name;
              if (currentAuthUser && (u.uid === currentAuthUser.uid || u.Email === currentAuthUser.email)) {
                currentUserName = name;
              }
            }
          }
        }

        let allSessions = [];
        try {
          const historySnap = await getDocs(collection(db, "ExamHistory"));
          historySnap.forEach(docSnap => {
            allSessions.push(docSnap.data());
          });
        } catch (e) {}

        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith("yan_exam_history_") || key.startsWith("yan_exam_session_"))) {
            const data = safeParse(localStorage.getItem(key));
            if (Array.isArray(data)) allSessions.push(...data);
            else if (data && typeof data === "object") allSessions.push(data);
          }
        }

        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
        const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek).getTime();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

        let rawToday = {}, rawWeek = {}, rawMonth = {};

        allSessions.forEach(record => {
          if (!record) return;
          const uid = record.userId || record.uid || record.email || "unknown";
          const score = extractCleanScore(record);
          const time = getTimestamp(record);

          let name = record.fullName || record.userName || record.name || usersMap[uid] || usersMap[record.email] || "";
          if (!name || name.toLowerCase() === "student" || name.toLowerCase() === "anonymous") return;

          if (time >= startOfToday) {
            rawToday[name] = (rawToday[name] || 0) + score;
          }
          if (time >= startOfWeek) {
            rawWeek[name] = (rawWeek[name] || 0) + score;
          }
          if (time >= startOfMonth) {
            rawMonth[name] = (rawMonth[name] || 0) + score;
          }
        });

        const mapToList = (obj) => {
          let list = [];
          for (let name in obj) {
            list.push({ name, score: obj[name] });
          }
          list.sort((a, b) => b.score - a.score);
          return list.slice(0, 50); // Top 50
        };

        globalRankingsData.today = mapToList(rawToday);
        globalRankingsData.week = mapToList(rawWeek);
        globalRankingsData.month = mapToList(rawMonth);

        if (currentAuthUser) {
          const currentList = globalRankingsData[currentPeriod];
          const userIndex = currentList.findIndex(item => item.name.toLowerCase() === currentUserName.toLowerCase());
          if (userIndex !== -1) {
            checkRankMilestones(currentAuthUser.uid, currentUserName, userIndex + 1, currentPeriod);
          }
        }

        renderLeaderboard(globalRankingsData[currentPeriod], currentUserName);

      } catch (err) {
        console.error("Leaderboard load error:", err);
        document.getElementById('rankings-list').innerHTML = `<div class="state-message">Unable to display leaderboard rankings.</div>`;
      }
    }

    window.renderLeaderboard = function(dataList, loggedInUserName = '') {
      const container = document.getElementById('rankings-list');
      container.innerHTML = '';

      if (!dataList || dataList.length === 0) {
        container.innerHTML = `<div class="state-message">No exam records found in Top 50 for this period.</div>`;
        return;
      }

      dataList.forEach((item, index) => {
        const isUser = loggedInUserName && item.name.toLowerCase() === loggedInUserName.toLowerCase();
        const row = document.createElement('div');
        row.className = `rank-row ${isUser ? 'highlight-user' : ''}`;
        row.innerHTML = `
          <div class="rank-number">${index + 1}${getSuffix(index + 1)}</div>
          <div class="rank-user-info">
            <span class="rank-name">${escapeHtml(item.name)} ${isUser ? '<strong>(You)</strong>' : ''}</span>
          </div>
          <div class="rank-score">${item.score}</div>
        `;
        container.appendChild(row);
      });
    }

    function getSuffix(n) {
      const s = ["th", "st", "nd", "rd"], v = n % 100;
      return s[(v - 20) % 10] || s[v] || s[0];
    }

    window.switchTab = function(period) {
      currentPeriod = period;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${period}`).classList.add('active');
      document.getElementById('search-bar').value = '';
      
      let loggedInUserName = '';
      renderLeaderboard(globalRankingsData[period], loggedInUserName);
    }

    window.filterLeaderboard = function() {
      const query = document.getElementById('search-bar').value.toLowerCase().trim();
      const currentList = globalRankingsData[currentPeriod];
      if (!query) {
        renderLeaderboard(currentList);
        return;
      }
      const filtered = currentList.filter(item => item.name.toLowerCase().includes(query));
      renderLeaderboard(filtered);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadGlobalLeaderboard();
  </script>



<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Yan-Dli Offline Engine Active:', reg.scope);
          // Auto update service worker if new version is deployed
          reg.onupdatefound = () => {
            const installingWorker = reg.installing;
            installingWorker.onstatechange = () => {
              if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('New update available! Reloading...');
              }
            };
          };
        })
        .catch((err) => console.error('ServiceWorker registration failed:', err));
    });
  }
</script>

</body>
</html>
