<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yan-Dli | Hard Question Bank</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #F3E8FF;
      --bg-gray: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-dark: #1F2937;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --danger: #EF4444;
      --danger-light: #FEF2F2;
      --success: #10B981;
      --success-light: #ECFDF5;
      --warning: #F59E0B;
      --warning-light: #FFFBEB;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ECEFF1;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-gray);
      min-height: 100vh;
      position: relative;
      padding-bottom: 90px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-color);
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      padding: 4px;
    }

    .chat-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .chat-btn-group svg {
      width: 18px;
      height: 18px;
      fill: #25D366;
    }

    .user-avatar-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid rgba(124, 58, 237, 0.15);
    }

    .user-avatar-btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
    }

    .content-body {
      padding: 1rem;
    }

    .page-header {
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.2;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      white-space: nowrap;
    }
    
    /* Group Card & Header Styles */
    .course-group-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .course-group-header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-color);
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .top-meta-badges {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .meta-badge-pill {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-badge-outline {
      font-size: 0.68rem;
      font-weight: 600;
      background: #FFFFFF;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    
    .group-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .group-course-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .group-code-pill {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--primary);
      color: white;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    
    .group-topic-row {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px dashed var(--border-color);
      margin-top: 2px;
    }

    .group-topic-row strong {
      font-weight: 500;
      color: var(--text-dark);
    }

    .group-questions-body {
      padding: 0.5rem 1rem;
    }

    .question-card-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .question-card-item:first-child {
      padding-top: 6px;
    }

    .question-card-item:last-child {
      border-bottom: none;
      padding-bottom: 6px;
    }

    .q-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .q-number {
      color: var(--primary);
      font-weight: 600;
      margin-right: 3px;
    }

    .q-text {
      font-weight: 500;
      font-size: 0.85rem;
      color: var(--text-dark);
      flex: 1;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .delete-icon-btn {
      background: var(--danger-light);
      border: none;
      cursor: pointer;
      color: var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: var(--radius-sm);
      transition: background 0.15s ease;
      flex-shrink: 0;
    }

    .delete-icon-btn:hover {
      background: #FEE2E2;
    }

    .delete-icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .question-image-wrap {
      margin: 8px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--bg-gray);
    }

    .question-image-wrap img {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #fff;
    }

    .instruction-box {
      font-size: 0.73rem;
      color: var(--text-muted);
      background: #F8FAFC;
      border-left: 3px solid var(--primary);
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .passage-box {
      font-size: 0.73rem;
      color: var(--text-dark);
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
      margin-bottom: 6px;
    }

    .opt-chip {
      background: var(--bg-gray);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      font-size: 0.73rem;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }

    .opt-chip.correct {
      background: var(--success-light);
      border-color: var(--success);
      color: #065F46;
      font-weight: 500;
    }

    .option-letter {
      font-weight: 600;
      margin-right: 3px;
    }

    .q-explanation {
      font-size: 0.73rem;
      color: var(--text-muted);
      background: var(--primary-light);
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      margin-top: 5px;
      overflow-wrap: anywhere;
    }

    .q-steps {
      font-size: 0.73rem;
      color: var(--text-dark);
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      margin-top: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    
    .empty-state {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      text-align: center;
      padding: 35px 15px;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }

    .empty-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .empty-title {
      color: var(--text-dark);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .empty-text {
      font-size: 0.74rem;
      line-height: 1.4;
    }

    .loading-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 30px 0;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .loading-spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      display: none;
      backdrop-filter: blur(2px);
    }

    .drawer-overlay.active {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: var(--card-bg);
      z-index: 101;
      transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.active {
      left: 0;
    }

    .drawer-header {
      background: var(--primary-light);
      padding: 1.5rem 1.25rem 1.25rem;
      position: relative;
    }

    .drawer-close-btn {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      background: none;
      border: none;
      font-size: 1.35rem;
      color: var(--primary);
      cursor: pointer;
      line-height: 1;
    }

    .drawer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .drawer-user-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary-hover);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drawer-edit-link {
      font-size: 0.75rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      display: inline-block;
      margin-top: 3px;
    }

    .drawer-menu {
      padding: 0.75rem 0;
      flex: 1;
      overflow-y: auto;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.75rem 1.25rem;
      color: var(--text-dark);
      text-decoration: none;
      font-size: 0.83rem;
      font-weight: 400;
      transition: background 0.15s ease;
    }

    .drawer-item svg {
      width: 17px;
      height: 17px;
      stroke: var(--primary);
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .drawer-item:hover {
      background: var(--bg-gray);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 0.4rem 0;
      z-index: 30;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.65rem;
      font-weight: 400;
      gap: 2px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 500;
    }

    .nav-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    @media (max-width: 360px) {
      .content-body { padding: 0.8rem; }
      .options-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <!-- FIREBASE SYNC ENGINE & UI CONTROLLER -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, deleteDoc, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
      authDomain: "yan-dli.firebaseapp.com",
      databaseURL: "https://yan-dli-default-rtdb.firebaseio.com",
      projectId: "yan-dli",
      storageBucket: "yan-dli.firebasestorage.app",
      messagingSenderId: "538794949165",
      appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch((err) => {
      console.error("Failed to set persistence:", err);
    });
    const db = getFirestore(app);

    let activeUserUid = null;
    let unsubscribeHardQuestions = null;
    let currentQuestions = [];
    const optionLetters = ['A', 'B', 'C', 'D', 'E'];

    function getLocalStorageKey(uid) {
      return uid ? `yan_hard_questions_${uid}` : 'yan_hard_questions_guest';
    }

    function safeParse(val, fallback = null) {
      try { 
        return (val === null || val === undefined || val === '') ? fallback : JSON.parse(val);
      } catch (e) { 
        return fallback;
      }
    }

    function getLocalHardQuestions(uid) {
      const userKey = getLocalStorageKey(uid);
      let data = safeParse(localStorage.getItem(userKey), null);
      if (!data && uid) {
        data = safeParse(localStorage.getItem('yan_hard_questions_guest'), []);
      }
      return Array.isArray(data) ? data : [];
    }

    function saveLocalHardQuestions(uid, items) {
      try { 
        const key = getLocalStorageKey(uid);
        localStorage.setItem(key, JSON.stringify(items));
      } catch (e) {
        console.error("Storage save error:", e);
      }
    }

    function getQuestionText(item) { return item?.q ?? item?.question ?? item?.text ?? ''; }
    function getQuestionId(item) { return String(item?.id ?? item?.questionId ?? item?.firestoreId ?? ''); }

    function escapeHtml(val) {
      const div = document.createElement('div');
      div.textContent = (val === null || val === undefined) ? '' : String(val);
      return div.innerHTML;
    }

    function renderHtmlContent(val) {
      if (val === null || val === undefined) return '';
      const str = String(val);
      if (/<[a-z][\s\S]*>/i.test(str)) return str;
      return escapeHtml(str);
    }

    function getQuestionOptions(item) {
      if (Array.isArray(item?.options)) return item.options;
      if (item?.options && typeof item.options === 'object') {
        return [item.options.A ?? item.options.a, item.options.B ?? item.options.b, item.options.C ?? item.options.c, item.options.D ?? item.options.d, item.options.E ?? item.options.e].filter(v => v !== undefined && v !== null);
      }
      const options = [];
      ['A', 'B', 'C', 'D', 'E'].forEach(l => {
        const v = item?.[`option_${l.toLowerCase()}`] ?? item?.[`option${l}`];
        if (v !== undefined && v !== null) options.push(v);
      });
      return options;
    }

    function parseCorrectAnswer(ans) {
      if (ans === null || ans === undefined) return -1;
      if (typeof ans === 'number') return (ans >= 1 && ans <= 5) ? ans - 1 : ((ans >= 0 && ans <= 4) ? ans : -1);
      if (typeof ans === 'string') {
        const clean = ans.trim().toUpperCase().replace(/\.$/, '');
        if (optionLetters.includes(clean)) return optionLetters.indexOf(clean);
        const parsed = parseInt(clean, 10);
        if (!Number.isNaN(parsed)) return (parsed >= 1 && parsed <= 5) ? parsed - 1 : ((parsed >= 0 && parsed <= 4) ? parsed : -1);
      }
      return -1;
    }

    function getImageUrl(item) { return item?.imageUrl ?? item?.imageURL ?? item?.image ?? item?.questionImage ?? item?.image_url ?? ''; }
    function getExplanation(item) { return item?.exp ?? item?.explanation ?? ''; }
    function getSteps(item) { return item?.steps ?? item?.solution ?? item?.working ?? ''; }

    function isValidCleanString(str) {
      if (!str || typeof str !== 'string') return false;
      const trimmed = str.trim();
      if (trimmed.length > 16 && /^[A-Za-z0-9]+$/.test(trimmed) && /[A-Z]/.test(trimmed) && /[a-z]/.test(trimmed) && /[0-9]/.test(trimmed)) {
        return false;
      }
      return true;
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        activeUserUid = user.uid;
        window.currentUserId = activeUserUid;
        localStorage.setItem('yan_current_user_uid', user.uid);
        
        try { await loadUserProfile(user); } catch (e) { console.error("Profile error:", e); }
        startFirebaseHardQuestionListener(activeUserUid);
      } else {
        const cachedUid = window.currentUserId || localStorage.getItem('yan_current_user_uid');
        if (cachedUid) {
          activeUserUid = cachedUid;
          currentQuestions = getLocalHardQuestions(activeUserUid);
          renderGroupedQuestions(currentQuestions);
          return;
        }

        activeUserUid = null;
        window.currentUserId = null;
        document.getElementById('student-badge').innerText = 'Not Signed In';
        document.getElementById('drawer-user-name').innerText = 'Guest Student';
        
        currentQuestions = getLocalHardQuestions(null);
        renderGroupedQuestions(currentQuestions);
      }
    });

    async function loadUserProfile(user) {
      let yanId = `YAN-${user.uid.substring(0, 6).toUpperCase()}`;
      let fullName = user.displayName || 'Student User';
      try {
        let ref = doc(db, 'Users', user.uid);
        let snap = await getDoc(ref);
        if (!snap.exists()) { ref = doc(db, 'users', user.uid); snap = await getDoc(ref); }
        if (snap.exists()) {
          const d = snap.data();
          yanId = d.YanId || d.userId || d.studentId || yanId;
          const f = d.Firstname || d.firstName || '';
          const l = d.Lastname || d.lastName || '';
          if (f || l) fullName = `${f} ${l}`.trim();
        }
      } catch (e) {}
      document.getElementById('student-badge').innerText = `ID: ${yanId}`;
      document.getElementById('drawer-user-name').innerText = fullName;
    }

    function startFirebaseHardQuestionListener(uid) {
      if (typeof unsubscribeHardQuestions === 'function') { 
        unsubscribeHardQuestions(); 
        unsubscribeHardQuestions = null; 
      }
      
      const ref = collection(db, 'users', uid, 'hard_questions');
      
      unsubscribeHardQuestions = onSnapshot(ref, (snap) => {
        let qList = snap.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
        
        if (qList.length === 0) {
          qList = getLocalHardQuestions(uid);
        }
        
        currentQuestions = qList;
        saveLocalHardQuestions(uid, qList);
        renderGroupedQuestions(qList);
      }, (err) => {
        console.error("Firestore listener error:", err);
        const local = getLocalHardQuestions(uid);
        currentQuestions = local;
        renderGroupedQuestions(local);
      });
    }

    function renderGroupedQuestions(questions) {
      const container = document.getElementById('hard-questions-container');
      const countLabel = document.getElementById('question-count');
      
      if (!Array.isArray(questions)) questions = [];
      countLabel.innerText = `${questions.length} question${questions.length === 1 ? '' : 's'}`;

      if (questions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </div>
            <div class="empty-title">No Hard Questions Yet</div>
            <div class="empty-text">Click the flag icon during practice to save difficult questions here by course and topic.</div>
          </div>`;
        return;
      }

      const groups = {};
      questions.forEach((item, originalIndex) => {
        const courseCode = isValidCleanString(item.courseCode || item.code) ? (item.courseCode || item.code) : 'GENERAL';
        const courseTitle = isValidCleanString(item.courseTitle) ? item.courseTitle : 'Course Assessment';
        const topicName = isValidCleanString(item.topicName || item.topic) ? (item.topicName || item.topic) : 'General Practice';
        const department = isValidCleanString(item.department || item.dept) ? (item.department || item.dept) : '';
        const levelId = isValidCleanString(item.levelId || item.level) ? (item.levelId || item.level) : '';
        const mode = isValidCleanString(item.mode || item.examMode) ? (item.mode || item.examMode) : 'PRACTICE';

        const groupKey = `${courseCode}___${courseTitle}___${topicName}___${department}___${levelId}___${mode}`;
        if (!groups[groupKey]) {
          groups[groupKey] = {
            courseCode,
            courseTitle,
            topicName,
            department,
            levelId,
            mode,
            items: []
          };
        }
        groups[groupKey].items.push({ item, originalIndex });
      });

      let htmlOutput = '';
      Object.values(groups).forEach(group => {
        htmlOutput += `
          <div class="course-group-card">
            <div class="course-group-header">
              <div class="top-meta-badges">
                ${group.department ? `<span class="meta-badge-pill" title="${escapeHtml(group.department)}">${escapeHtml(group.department)}</span>` : ''}
                ${group.levelId ? `<span class="meta-badge-outline">${escapeHtml(group.levelId)}</span>` : ''}
                <span class="meta-badge-outline" style="text-transform: uppercase;">${escapeHtml(group.mode)}</span>
              </div>
              <div class="group-title-row">
                <div class="group-course-title">${escapeHtml(group.courseTitle)}</div>
                ${group.courseCode !== 'GENERAL' ? `<span class="group-code-pill">${escapeHtml(group.courseCode)}</span>` : ''}
              </div>
              <div class="group-topic-row">
                Topic: <strong>${escapeHtml(group.topicName)}</strong> <span style="float: right; font-size: 0.7rem; color: var(--primary); font-weight: 500;">${group.items.length} item${group.items.length === 1 ? '' : 's'}</span>
              </div>
            </div>
            <div class="group-questions-body">
              ${group.items.map((obj, subIndex) => renderQuestionCard(obj.item, subIndex)).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = htmlOutput;
    }

    function renderQuestionCard(item, index) {
      const qText = getQuestionText(item);
      const options = getQuestionOptions(item);
      const correctAns = parseCorrectAnswer(item.answer ?? item.correctAnswer ?? item.correct_option);
      const explanation = getExplanation(item);
      const steps = getSteps(item);
      const imageUrl = getImageUrl(item);
      const qId = getQuestionId(item) || `q_${index}`;
      const safeId = String(qId).replace(/"/g, '"');
      
      const passage = item.passage || item.comprehension || '';
      const instruction = item.instruction || '';

      return `
        <div class="question-card-item" id="q-item-${safeId}">
          <div class="q-header-row">
            <div class="q-text"><span class="q-number">Q${index + 1}.</span> ${renderHtmlContent(qText)}</div>
            <button class="delete-icon-btn" data-question-id="${safeId}" onclick="window.removeHardQuestion(this.dataset.questionId)" title="Remove Question">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
          ${passage ? `<div class="passage-box">${renderHtmlContent(passage)}</div>` : ''}
          ${instruction ? `<div class="instruction-box">${renderHtmlContent(instruction)}</div>` : ''}
          ${imageUrl ? `<div class="question-image-wrap"><img src="${escapeHtml(imageUrl)}" alt="Question image" loading="lazy" onerror="this.parentElement.style.display='none';"></div>` : ''}
          ${options.length ? `
            <div class="options-grid">
              ${options.slice(0, 5).map((opt, optIdx) => `
                <div class="opt-chip ${correctAns === optIdx ? 'correct' : ''}">
                  <span class="option-letter">${optionLetters[optIdx] || ''}</span> ${renderHtmlContent(opt)}
                </div>`).join('')}
            </div>` : ''}
          ${explanation ? `<div class="q-explanation">💡 <strong>Explanation:</strong> ${renderHtmlContent(explanation)}</div>` : ''}
          ${steps ? `<div class="q-steps"><strong>Solution / Steps:</strong><br>${renderHtmlContent(steps)}</div>` : ''}
        </div>`;
    }

    window.removeHardQuestion = async function(questionId) {
      const id = String(questionId);
      const targetUid = activeUserUid || null;
      
      let localItems = getLocalHardQuestions(targetUid).filter(item => {
        const itemId = String(item.id ?? item.questionId ?? item.firestoreId ?? '');
        return itemId !== id;
      });
      
      saveLocalHardQuestions(targetUid, localItems);
      currentQuestions = localItems;
      renderGroupedQuestions(currentQuestions);
      
      if (!targetUid || !navigator.onLine) return;
      
      try {
        await deleteDoc(doc(db, 'users', targetUid, 'hard_questions', id));
      } catch (e) {
        console.error("Firestore delete failed:", e);
      }
    };

    window.addEventListener('storage', (event) => {
      const expectedKey = getLocalStorageKey(activeUserUid);
      if (event.key === expectedKey || event.key === 'yan_hard_questions_guest') {
        const updatedItems = getLocalHardQuestions(activeUserUid);
        currentQuestions = updatedItems;
        renderGroupedQuestions(updatedItems);
      }
    });
  </script>

  <!-- DRAWER TOGGLE SCRIPT -->
  <script>
    function toggleDrawer(open) {
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawer-overlay');
      if (open) { 
        drawer.classList.add('active'); 
        overlay.classList.add('active'); 
      } else { 
        drawer.classList.remove('active'); 
        overlay.classList.remove('active'); 
      }
    }
  </script>
</body>
</html>
