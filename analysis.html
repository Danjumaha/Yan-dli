<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yan-Dli | Performance Analytics</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C3AED">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8B5CF6;
      --primary-dark: #7C3AED;
      --primary-light: #F3E8FF;
      --bg-body: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --success-light: #D1FAE5;
      --danger: #EF4444;
      --danger-light: #FEE2E2;
      --warning: #F59E0B;
      --warning-light: #FEF3C7;
      --radius-app: 20px;
      --radius-btn: 12px;
      --shadow-card: 0 4px 16px -2px rgba(139, 92, 246, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      --font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; }

    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 930px;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
    }

    @media (min-width: 500px) {
      .app-shell {
        height: 92vh;
        border-radius: 32px;
        border: 6px solid #0F172A;
      }
    }

    /* HEADER */
    .app-header {
      padding: 14px 16px 12px;
      background: #FFFFFF;
      border-bottom: 1px solid #F1F5F9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .header-left-group { display: flex; align-items: center; gap: 10px; }

    .back-btn {
      width: 38px; height: 38px; border-radius: 50%; background: #F8FAFC; color: var(--text-main);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; transition: all 0.2s ease;
    }
    .back-btn:hover { background: var(--primary-light); border-color: var(--primary-dark); color: var(--primary-dark); }
    .back-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .app-header-title { font-size: 0.95rem; font-weight: 800; color: var(--text-main); }
    .app-header-subtitle { font-size: 0.68rem; color: var(--text-sub); font-weight: 600; }

    /* VIEW CONTROL BAR (When inside a date folder) */
    .view-control-bar {
      padding: 10px 16px; background: #FFFFFF; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }
    .active-date-label { font-size: 0.85rem; font-weight: 800; color: var(--text-main); }
    .change-date-btn {
      background: var(--primary-light); color: var(--primary-dark); border: 1px solid rgba(139,92,246,0.2);
      padding: 5px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s;
    }
    .change-date-btn:hover { background: #EDE9FE; }
    .change-date-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.5; fill: none; }

    .app-content {
      flex: 1; overflow-y: auto; padding: 12px 16px 80px; scroll-behavior: smooth; display: flex; flex-direction: column; gap: 12px;
    }

    /* DATE FOLDER CARDS */
    .date-folder-card {
      background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow-card);
    }
    .date-folder-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .folder-left { display: flex; align-items: center; gap: 12px; }
    .folder-icon-box {
      width: 38px; height: 38px; border-radius: 10px; background: var(--primary-light); color: var(--primary-dark);
      display: flex; align-items: center; justify-content: center;
    }
    .date-folder-card:hover .folder-icon-box { background: #FFFFFF; }
    .folder-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); }
    .folder-sub { font-size: 0.68rem; color: var(--text-sub); font-weight: 600; }
    .folder-badge { background: var(--primary); color: #FFFFFF; font-size: 0.68rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; }

    /* ANALYTICS HERO CARD */
    .analytics-hero {
      background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%); color: white; border-radius: 16px; padding: 1.15rem; box-shadow: 0 8px 20px -4px rgba(124,58,237,0.25); position: relative; overflow: hidden;
    }
    .hero-subtitle { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; opacity: 0.9; margin-bottom: 2px; }
    .hero-title { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 6px; }
    .hero-desc { font-size: 0.74rem; opacity: 0.95; font-weight: 500; line-height: 1.35; }
    .hero-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(255,255,255,0.18); }
    .hero-stat-cell { display: flex; flex-direction: column; }
    .hero-stat-lbl { font-size: 0.6rem; opacity: 0.85; font-weight: 700; text-transform: uppercase; }
    .hero-stat-val { font-size: 0.95rem; font-weight: 800; margin-top: 1px; }

    /* METRICS GRID */
    .stats-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 4px; }
    .stat-card-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
    .stat-card-icon.purple { background: var(--primary-light); color: var(--primary-dark); }
    .stat-card-icon.green { background: var(--success-light); color: var(--success); }
    .stat-card-icon.orange { background: var(--warning-light); color: var(--warning); }
    .stat-card-icon.blue { background: #EFF6FF; color: #2563EB; }
    .stat-card-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .stat-card-lbl { font-size: 0.68rem; color: var(--text-sub); font-weight: 700; }
    .stat-card-val { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }

    /* BREAKDOWN CARD */
    .section-title { font-size: 0.82rem; font-weight: 800; color: var(--text-main); margin-top: 4px; display: flex; align-items: center; justify-content: space-between; }
    .analytics-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; box-shadow: var(--shadow-card); }
    .breakdown-list { display: flex; flex-direction: column; gap: 10px; }
    .breakdown-item { display: flex; flex-direction: column; gap: 4px; }
    .breakdown-info { display: flex; align-items: center; justify-content: space-between; font-size: 0.74rem; }
    .breakdown-name { font-weight: 800; color: var(--text-main); }
    .breakdown-score { font-weight: 800; color: var(--primary-dark); }
    .progress-bar-bg { width: 100%; height: 7px; background: #F1F5F9; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary-dark); border-radius: 4px; transition: width 0.5s ease; }
    .progress-bar-fill.green { background: var(--success); }
    .progress-bar-fill.orange { background: var(--warning); }
    .progress-bar-fill.red { background: var(--danger); }

    /* EMPTY & LOADING STATES */
    .empty-state { text-align: center; padding: 3rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-sub); }
    .empty-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-light); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
    .loading-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 10px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #FFFFFF; border-top: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; z-index: 30; }
    .btn-bottom-cta { width: 100%; height: 40px; border-radius: var(--radius-btn); background: var(--primary); color: white; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; box-shadow: 0 4px 12px rgba(139,92,246,0.25); }
    .btn-bottom-cta svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- APP HEADER -->
  <header class="app-header">
    <div class="header-left-group">
      <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div>
        <h1 class="app-header-title">Performance Analytics</h1>
        <p class="app-header-subtitle" id="header-subtitle">Loading metrics...</p>
      </div>
    </div>
  </header>

  <!-- VIEW CONTROL BAR (Appears inside a date folder) -->
  <div id="view-control-bar" class="view-control-bar" style="display: none;">
    <span class="active-date-label" id="active-date-title">October 20, 2026</span>
    <button type="button" class="change-date-btn" onclick="backToDateFolders()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Change Date
    </button>
  </div>

  <!-- CONTENT CONTAINER -->
  <main class="app-content" id="analytics-content-container">
    <div class="empty-state">
      <div class="loading-spinner"></div>
      <div style="font-weight: 800; font-size: 0.85rem; color: var(--text-main);">Analyzing exam metrics...</div>
    </div>
  </main>

  <!-- BOTTOM CTA NAV -->
  <nav class="bottom-nav">
    <a href="exams.html" class="btn-bottom-cta">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Take New Practice Test
    </a>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAcJ2YJQ0hz27M8CxuPiaqzIiCNdx8LvCY",
  authDomain: "yan-dli.firebaseapp.com",
  projectId: "yan-dli",
  storageBucket: "yan-dli.firebasestorage.app",
  messagingSenderId: "538794949165",
  appId: "1:538794949165:web:7425a4ba4e915b7e6996a4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let historyRecords = [];
let currentSelectedDate = null; // null = viewing date folders list
let currentUserId = null;

const getLocalHistoryKey = uid => `yan_exam_history_${uid}`;

function safeParse(val) { try { return JSON.parse(val); } catch { return null; } }
function safeLocalGet(key) { try { return safeParse(localStorage.getItem(key)); } catch { return null; } }

function escapeHTML(val) {
  if (val == null) return "";
  return String(val).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function getQuestions(record) {
  if (!record) return [];
  const candidates = [record.questionsData, record.questions, record.questionData, record.questionList, record.items, record.examQuestions, record.questionBank];
  for (const v of candidates) if (Array.isArray(v) && v.length) return v;
  return [];
}

function getRecordTime(record) {
  if (!record) return 0;
  const values = [record.submittedAt, record.completedAt, record.finishedAt, record.timestamp, record.createdAt, record.updatedAt];
  for (const v of values) {
    if (!v) continue;
    if (typeof v === "object" && typeof v.toDate === "function") return v.toDate().getTime();
    if (typeof v === "object" && v.seconds != null) return Number(v.seconds) * 1000;
    if (typeof v === "number") return v > 10000000000 ? v : v * 1000;
    if (typeof v === "string") {
      const t = new Date(v).getTime();
      if (!Number.isNaN(t)) return t;
    }
  }
  return 0;
}

function getStableRecordId(record) {
  if (!record) return `session_${Date.now()}`;
  const possibleIds = [record.sessionId, record.examSessionId, record.attemptId, record.historyId, record.recordId, record.id];
  for (const v of possibleIds) if (v !== undefined && v !== null && String(v).trim()) return String(v);
  const t = getRecordTime(record);
  return t ? `session_${t}` : `session_${Date.now()}`;
}

function normalizeSession(record) {
  if (!record || typeof record !== "object") return null;
  const qs = getQuestions(record);
  const total = Number(record.totalQuestions ?? record.total ?? qs.length ?? 0);
  const correct = Number(record.correctAnswersCount ?? record.correctCount ?? 0);
  const score = record.scorePercentage !== undefined ? Number(record.scorePercentage) : record.score !== undefined ? Number(record.score) : total > 0 ? Math.round((correct / total) * 100) : 0;
  return { ...record, totalQuestions: total, correctCount: correct, score, scorePercentage: score };
}

function collectAllLocalRecords(uid) {
  const records = [];
  const localData = safeLocalGet(getLocalHistoryKey(uid));
  if (Array.isArray(localData)) {
    localData.forEach(r => { if (!r.userId || String(r.userId) === String(uid)) records.push(normalizeSession(r)); });
  }
  try {
    const prefix = `yan_exam_session_${uid}_`;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith(prefix)) continue;
      const data = safeLocalGet(key);
      if (data && typeof data === "object") records.push(normalizeSession(data));
    }
  } catch (e) {}
  return records.filter(Boolean);
}

async function fetchFirestoreHistory(uid) {
  const records = [];
  try {
    const q = query(collection(db, "ExamHistory"), where("userId", "==", uid));
    const snap = await getDocs(q);
    snap.forEach(docSnap => {
      records.push(normalizeSession({ ...docSnap.data(), id: docSnap.id }));
    });
  } catch (e) {}
  return records;
}

/**
 * AUTOMATIC MILESTONE DISPATCHER FOR ANALYTICS
 */
async function evaluateAnalyticsMilestones(uid, records) {
  if (!uid || !records || records.length === 0) return;

  const totalExams = records.length;
  const avgScore = Math.round(records.reduce((sum, r) => sum + (r.scorePercentage ?? 0), 0) / totalExams);
  const todayDateStr = new Date().toISOString().split('T')[0];

  // Milestone: 5+ tests completed with 70%+ high mastery
  if (totalExams >= 3 && avgScore >= 70) {
    const cooldownKey = `yan_notif_mastery_${uid}_${todayDateStr}`;
    if (!localStorage.getItem(cooldownKey)) {
      try {
        await addDoc(collection(db, "Notifications"), {
          userId: uid,
          title: "🎯 Outstanding Performance Level!",
          message: `Impressive mastery! You've completed ${totalExams} practice tests with an overall average score of ${avgScore}%.`,
          type: "success",
          targetDate: todayDateStr,
          isRead: false,
          createdAt: new Date().toISOString()
        });
        localStorage.setItem(cooldownKey, "true");
      } catch(e) {}
    }
  }
}

async function loadAnalyticsData(userId) {
  currentUserId = userId;
  const local = collectAllLocalRecords(userId);
  const map = new Map();
  local.forEach(r => map.set(getStableRecordId(r), r));
  
  if (navigator.onLine) {
    const remote = await fetchFirestoreHistory(userId);
    remote.forEach(r => map.set(getStableRecordId(r), r));
  }

  historyRecords = Array.from(map.values()).sort((a, b) => getRecordTime(b) - getRecordTime(a));
  
  evaluateAnalyticsMilestones(userId, historyRecords);

  const urlParams = new URLSearchParams(window.location.search);
  const targetDateParam = urlParams.get('date');
  if (targetDateParam && !currentSelectedDate) {
    currentSelectedDate = targetDateParam;
  }

  renderCurrentState();
}

function renderCurrentState() {
  if (currentSelectedDate) {
    renderAnalyticsForDate(currentSelectedDate);
  } else {
    renderDateFolders();
  }
}

// GROUP ANALYTICS BY STORED DATES (YYYY-MM-DD)
function renderDateFolders() {
  document.getElementById('view-control-bar').style.display = 'none';
  const container = document.getElementById('analytics-content-container');
  const subtitle = document.getElementById('header-subtitle');

  const dateMap = {};
  historyRecords.forEach(item => {
    const time = getRecordTime(item) || Date.now();
    const d = new Date(time);
    const dateKey = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    if (!dateMap[dateKey]) dateMap[dateKey] = [];
    dateMap[dateKey].push(item);
  });

  const availableDates = Object.keys(dateMap).sort().reverse();
  subtitle.textContent = availableDates.length > 0 ? `${availableDates.length} stored date${availableDates.length > 1 ? 's' : ''}` : 'No analytics logs';

  if (availableDates.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        </div>
        <div style="font-weight: 800; font-size: 0.85rem; color: var(--text-main);">No Analytics Data Yet</div>
        <div style="font-size: 0.72rem;">Complete a practice exam to generate performance metrics.</div>
      </div>
    `;
    return;
  }

  container.innerHTML = availableDates.map(dateStr => {
    const count = dateMap[dateStr].length;
    const formattedDateName = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

    return `
      <div class="date-folder-card" onclick="openDateFolder('${dateStr}')">
        <div class="folder-left">
          <div class="folder-icon-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div>
            <div class="folder-title">${formattedDateName}</div>
            <div class="folder-sub">${count} test attempt${count > 1 ? 's' : ''} analyzed</div>
          </div>
        </div>
        <div class="folder-badge">${count}</div>
      </div>
    `;
  }).join('');
}

window.openDateFolder = function(dateStr) {
  currentSelectedDate = dateStr;
  renderAnalyticsForDate(dateStr);
};

window.backToDateFolders = function() {
  currentSelectedDate = null;
  if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.pathname);
  }
  renderDateFolders();
};

function renderAnalyticsForDate(dateStr) {
  document.getElementById('view-control-bar').style.display = 'flex';
  const container = document.getElementById('analytics-content-container');
  const subtitle = document.getElementById('header-subtitle');
  const activeDateTitle = document.getElementById('active-date-title');

  const formattedHeaderDate = new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  activeDateTitle.textContent = formattedHeaderDate;

  const filtered = historyRecords.filter(item => {
    const time = getRecordTime(item) || Date.now();
    const d = new Date(time);
    const itemDateStr = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    return itemDateStr === dateStr;
  });

  subtitle.textContent = `${filtered.length} attempt${filtered.length !== 1 ? 's' : ''} on this date`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        </div>
        <div style="font-weight: 800; font-size: 0.85rem; color: var(--text-main);">No logs found for this date</div>
        <div style="font-size: 0.72rem;">Click "Change Date" above to select another date.</div>
      </div>
    `;
    return;
  }

  // Calculate Metrics for this specific date
  const totalExams = filtered.length;
  let totalQuestionsSolved = 0;
  let totalCorrectAnswers = 0;
  let totalTimeSeconds = 0;
  let bestScore = 0;
  let passingExams = 0;
  let scoreSum = 0;
  const subjectMap = {};

  filtered.forEach(rec => {
    const score = Number(rec.scorePercentage ?? rec.score ?? 0);
    const totalQ = Number(rec.totalQuestions || getQuestions(rec).length || 0);
    const correctQ = Number(rec.correctCount ?? rec.correctAnswersCount ?? 0);
    const timeSpent = Number(rec.timeSpentSeconds ?? rec.durationSeconds ?? rec.timeSpent ?? 0);
    const course = rec.courseCode || rec.courseTitle || rec.courseName || rec.subject || rec.examTitle || "General Practice";

    scoreSum += score;
    if (score > bestScore) bestScore = score;
    if (score >= 50) passingExams++;

    totalQuestionsSolved += totalQ;
    totalCorrectAnswers += correctQ;
    totalTimeSeconds += timeSpent;

    if (!subjectMap[course]) subjectMap[course] = { count: 0, totalScore: 0 };
    subjectMap[course].count++;
    subjectMap[course].totalScore += score;
  });

  const avgScore = Math.round(scoreSum / totalExams);
  const passRate = Math.round((passingExams / totalExams) * 100);
  const accuracyRate = totalQuestionsSolved > 0 ? Math.round((totalCorrectAnswers / totalQuestionsSolved) * 100) : 0;
  const avgPace = totalQuestionsSolved > 0 ? Math.round(totalTimeSeconds / totalQuestionsSolved) : 0;
  const totalMins = Math.round(totalTimeSeconds / 60);

  let standingMsg = "Good consistency. Keep taking tests regularly to improve performance.";
  if (avgScore >= 75) standingMsg = "Top tier daily standing! Excellent accuracy and course mastery.";
  else if (avgScore >= 50) standingMsg = "Solid progress made on this date. Review incorrect answers to boost scores.";

  const subjectEntries = Object.entries(subjectMap);

  container.innerHTML = `
    <!-- HERO STANDING CARD -->
    <div class="analytics-hero">
      <div class="hero-subtitle">Daily Academic Standing</div>
      <div class="hero-title">${avgScore}%</div>
      <div class="hero-desc">${standingMsg}</div>
      <div class="hero-stats-row">
        <div class="hero-stat-cell">
          <span class="hero-stat-lbl">Exams Taken</span>
          <span class="hero-stat-val">${totalExams}</span>
        </div>
        <div class="hero-stat-cell">
          <span class="hero-stat-lbl">Questions</span>
          <span class="hero-stat-val">${totalQuestionsSolved}</span>
        </div>
        <div class="hero-stat-cell">
          <span class="hero-stat-lbl">Pass Rate</span>
          <span class="hero-stat-val">${passRate}%</span>
        </div>
      </div>
    </div>

    <!-- QUICK METRICS GRID -->
    <div class="stats-grid-2">
      <div class="stat-card">
        <div class="stat-card-icon green">
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="stat-card-lbl">Best Daily Score</div>
        <div class="stat-card-val">${bestScore}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon orange">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-card-lbl">Avg Pace</div>
        <div class="stat-card-val">${avgPace}s / q</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon purple">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="stat-card-lbl">Time Spent</div>
        <div class="stat-card-val">${totalMins > 60 ? `${(totalMins/60).toFixed(1)}h` : `${totalMins}m`}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-icon blue">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        </div>
        <div class="stat-card-lbl">Accuracy Rate</div>
        <div class="stat-card-val">${accuracyRate}%</div>
      </div>
    </div>

    <!-- SUBJECT BREAKDOWN -->
    <div class="section-title">
      <span>Subject Performance</span>
      <span style="font-size:0.72rem;color:var(--text-sub);font-weight:600;">${subjectEntries.length} Subject${subjectEntries.length === 1 ? '' : 's'}</span>
    </div>
    <div class="analytics-card">
      <div class="breakdown-list">
        ${subjectEntries.map(([name, data]) => {
          const avgSubScore = Math.round(data.totalScore / data.count);
          const fillClass = avgSubScore >= 70 ? "green" : avgSubScore >= 50 ? "orange" : "red";
          return `
            <div class="breakdown-item">
              <div class="breakdown-info">
                <span class="breakdown-name">${escapeHTML(name)}</span>
                <span class="breakdown-score">${avgSubScore}% avg (${data.count} test${data.count === 1 ? '' : 's'})</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill ${fillClass}" style="width: ${Math.min(100, Math.max(5, avgSubScore))}%"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.replace("index.html");
      return;
    }
    loadAnalyticsData(user.uid);
  });
});
</script>
</body>
</html>
